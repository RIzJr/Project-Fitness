# Codemagic: builds the iPhone app (to TestFlight) and the Android app (to Google Play) in the cloud.
# Android set-up: see ANDROID.md.
# Set-up once in codemagic.io (see APP-STORE.md):
#   1. Team integrations > Developer Portal: add the App Store Connect API key and name it  PF ASC key
#   2. Code signing identities: Generate certificate (Apple Distribution), then Fetch profiles (App Store, com.rizjr.projectfitness)
# Then press "Start new build" and pick "iOS to TestFlight".
workflows:
  ios-testflight:
    name: iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: PF ASC key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rizjr.projectfitness
      node: 22
      xcode: latest
    # Builds only start when you press the button (saves free minutes).
    # To build automatically on every push to main, delete the # on the next 4 lines.
    # triggering:
    #   events: [push]
    #   branch_patterns:
    #     - pattern: main
    scripts:
      - name: Install
        script: npm ci
      - name: Copy the web app into the iPhone project
        script: npm run build && npx cap sync ios
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj
      - name: Build the app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # every build goes to the external TestFlight group "Test" (Apple may run a short beta review first)
        beta_groups:
          - Test
        submit_to_app_store: false

  # ---------- Android ----------
  # Both Android workflows run the same build steps (YAML anchors).
  android-bundle:
    name: Android app bundle (first upload)
    # Builds a signed .aab without sending it anywhere. Use it once, for the very first upload,
    # which Google Play only accepts by hand in Play Console (see ANDROID.md, step 4).
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      android_signing:
        - PF upload key
      node: 22
      java: 21
    scripts: &android_scripts
      - name: Install
        script: npm ci
      - name: Copy the web app into the Android project
        script: npm run build && npx cap sync android
      - name: Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Version code (latest on Google Play + 1)
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "com.rizjr.projectfitness" 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then echo "PF_VERSION_CODE=$((LATEST + 1))" >> $CM_ENV; else echo "PF_VERSION_CODE=$BUILD_NUMBER" >> $CM_ENV; fi
      - name: Build the app bundle
        script: cd android && chmod +x gradlew && ./gradlew bundleRelease
    artifacts: &android_artifacts
      - android/app/build/outputs/**/*.aab

  android-play:
    name: Android to Google Play
    # Every build goes to the Internal testing track. Testers are added in Play Console (see ANDROID.md).
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      android_signing:
        - PF upload key
      groups:
        - google_play
      node: 22
      java: 21
    scripts: *android_scripts
    artifacts: *android_artifacts
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # while the app is still a draft in Play Console (before its first review), releases must be drafts too;
        # once Google has approved the app, change this to false so builds reach testers straight away
        submit_as_draft: true
