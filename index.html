<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0D0E10">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head>
<body>
<title>Project Fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Bold & Athletic: Archivo throughout, dark by default, one bright accent */
:root{
  --bg:#F3F4F5; --surface:#FFFFFF; --sunk:#EBEDEF; --fg:#0D0E10; --muted:#5A6169; --line:#E0E3E6;
  --accent:#3F6212; --accent-ink:#FFFFFF;
  --protein:#C2410C; --veg:#3E8A3A; --carb:#B7791F; --fat:#6D28D9;
  --display:"Archivo","Arial",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0E10; --surface:#17191C; --sunk:#202328; --fg:#F4F5F6; --muted:#9AA1A9; --line:#2B2F35;
  --accent:#D4FF3A; --accent-ink:#0D0E10;
  --protein:#FF7A45; --veg:#7CC476; --carb:#FFC53D; --fat:#A78BFA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0E10; --surface:#17191C; --sunk:#202328; --fg:#F4F5F6; --muted:#9AA1A9; --line:#2B2F35;
  --accent:#D4FF3A; --accent-ink:#0D0E10;
  --protein:#FF7A45; --veg:#7CC476; --carb:#FFC53D; --fat:#A78BFA; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:850;font-stretch:118%;font-size:34px;line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
h2{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:19px;margin:0}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
section.panel{background:var(--surface);border:1px solid transparent;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
:root[data-theme="light"] section.panel{border-color:var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.banner{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
/* macros */
.macro{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.macro:first-of-type{border-top:0;padding-top:0}
.macro .left{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar.over i{background:repeating-linear-gradient(45deg,var(--c) 0 6px,transparent 6px 9px)}
.editform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--sunk);border-radius:10px;padding:12px}
.editform .wide{grid-column:1/-1}
.editform .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:380px){.editform{grid-template-columns:1fr 1fr}}
/* portions */
.portion{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.portion:first-of-type{border-top:0;padding-top:0}
.pname{display:flex;align-items:baseline;gap:8px}
.pname b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.pname span{font-size:12.5px;color:var(--muted)}
.count{font-family:var(--display);font-size:30px;font-weight:850;font-stretch:110%;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.count small{font-size:16px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px;flex-wrap:wrap;grid-column:1}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.full{background:var(--c)}
.dot.half{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.over{background:var(--c);opacity:.45}
.steppers{display:flex;gap:6px;grid-column:2;justify-content:flex-end}
.steppers button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}
.steppers button.add{background:var(--c);border-color:var(--c);color:#fff}
.kcal{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:10px;padding:10px 12px}
.kcal b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
/* settings */
.hq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.hq:first-child{border-top:0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:none;width:112px}
.yn button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600;font-size:13px}
.yn button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{border:1px solid var(--carb);background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:.18em;text-align:center;background:var(--sunk);border-radius:12px;padding:10px}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phthumb{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.phthumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;background:var(--sunk)}
.phthumb span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phthumb:focus-visible img{outline:2px solid var(--accent);outline-offset:2px}
.viewer{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.vbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.vimgs{flex:1;min-height:0;display:grid;gap:6px}.vimgs.two{grid-template-columns:1fr 1fr}
.vimgs figure{margin:0;min-height:0;display:flex;flex-direction:column;gap:4px}
.vimgs img{flex:1;min-height:0;width:100%;object-fit:contain}
.vimgs figcaption{font-size:12px;text-align:center;opacity:.8}
.onboard{max-width:480px;margin:4vh auto 0;padding-bottom:40px}
.gate{max-width:440px;margin:8vh auto 0;padding-bottom:40px;display:flex;flex-direction:column;gap:16px}
.gate-card{background:var(--surface);border-radius:20px;padding:30px 24px 26px;gap:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.gate-brand{font-family:var(--display);font-size:22px;font-weight:900;font-stretch:118%;line-height:1}.gate-brand span{color:var(--accent)}
.gate-h{font-size:30px;margin:4px 0 0}
.gate-in{all:unset;box-sizing:border-box;width:100%;font-size:17px;padding:10px 2px;border-bottom:1px solid var(--muted);color:var(--fg)}
.gate-in:focus,.gate-in:focus-visible{outline:none;box-shadow:none}.gate-card a{color:var(--accent)}.gate-in::placeholder{color:var(--muted)}.gate-in:focus{border-bottom:2px solid var(--accent);padding-bottom:9px}
.gate-p{margin:0;font-size:14px}
.gate-link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}.gate-link:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.gate-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.gate-btns .btn{min-width:108px;height:46px;border-radius:12px;font-size:16px;justify-content:center}
.gate-back{background:var(--sunk);border-color:var(--sunk)}
.gate-who{all:unset;cursor:pointer;font-size:14px;color:var(--fg);display:inline-flex;gap:8px;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate-local{align-self:center;font-size:15px}
.onboard h1{font-size:38px}
.obdots{display:flex;gap:6px}.obdots i{flex:1;height:4px;border-radius:99px;background:var(--line)}.obdots i.on{background:var(--accent)}
.obpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.obpick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.obpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:24px;font-weight:850;font-stretch:110%;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .label{font-size:10.5px}
.good{color:var(--veg)}
.ciq{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ciq:first-of-type{border-top:0;padding-top:0}
.anchors{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.focusnote{border-left:4px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.ctable{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctable th,.ctable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
.ctable thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.ctable th[scope=row],.ctable thead th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
[hidden]{display:none!important}
form.row .btn{white-space:nowrap;flex:none}
.setrow{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.setrow:first-child{border-top:0}
.setrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.chev{font-size:24px;line-height:1;color:var(--muted)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.avatar.big{width:56px;height:56px;font-size:20px;display:flex}
.who-row{display:flex;align-items:center;gap:12px;min-width:0}
.btn.back{padding:4px 0;margin-bottom:8px;display:block}
nav.tabs button{font-size:10.5px;letter-spacing:0;text-transform:none}
/* quick estimate */
.meal{border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
/* quote */
.quote{position:relative;background:var(--surface);color:var(--fg);border-radius:20px;padding:16px 48px 16px 16px}
.quote .label{color:var(--accent);opacity:1}
.quote.photo .label{color:#fff;opacity:.85}
:root[data-theme="light"] .quote .label{color:var(--accent)}
.quote p{margin:6px 0 0;font-family:var(--display);font-weight:800;font-stretch:108%;font-size:21px;line-height:1.2;text-wrap:pretty}
.quote .who{margin-top:8px;font-size:13.5px;font-weight:600;opacity:.85}
.quote{background-size:cover;background-position:center}
.quote.photo{color:#fff}
.qbtns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.quote .qbtns button{position:static}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);background:var(--l);box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .sw{background:var(--d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:var(--d)}}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quote button{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:1px solid currentColor;background:transparent;color:inherit;font-size:17px;line-height:1;opacity:.85}
/* habits */
.habit{display:flex;gap:10px;align-items:center;padding:6px 0}
.habit input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hrow{display:flex;gap:6px;align-items:center}
.hrow input{flex:1;background:var(--surface)}
.hb{flex:none;width:36px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;line-height:1}
.hb:disabled{opacity:.35;cursor:default}
.hb.del{color:var(--protein)}
/* foods */
.food{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.food:first-child{border-top:0}
.food .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.food .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px;color:var(--c);border:1px solid var(--c)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 4px}
.result{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px}
.status{font-size:13px;color:var(--muted);min-height:1em}
/* workouts */
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 52px 40px 22px;gap:5px;align-items:center}
.set select{padding:9px 4px;text-align:center}
/* workout mode */
.player{position:fixed;inset:0;z-index:18;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));overflow:auto;max-width:560px;margin:0 auto}
.wp-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wp-head .iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.wp-title{display:flex;flex-direction:column;align-items:center;min-width:0}.wp-title b{font-weight:800;font-stretch:115%;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}.wp-title span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.wp-seg{display:flex;gap:4px}.wp-seg i{flex:1;height:4px;border-radius:99px;background:var(--line)}.wp-seg i.on{background:var(--accent)}.wp-seg i.cur{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
.wp-body{flex:1 0 auto;display:flex;flex-direction:column;gap:12px}
.wp-ex{font-size:32px;line-height:1.05}
.wp-name{font-size:22px;font-weight:800;padding:12px}
.wp-sets{display:flex;gap:6px;flex-wrap:wrap}
.wp-chip{flex:1;min-width:70px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px}
.wp-chip.done{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border-color:transparent;color:var(--fg)}
.wp-chip.cur{border:2px solid var(--accent);color:var(--fg)}
.wp-chip.add{flex:0 0 42px;min-width:42px;font-size:20px}
.wp-step{background:var(--surface);border-radius:20px;padding:12px;display:flex;align-items:center;justify-content:space-between}
.wp-step button{width:68px;height:68px;border-radius:18px;border:0;background:var(--sunk);color:var(--fg);font-size:32px;font-weight:700}
.wp-step div{display:flex;flex-direction:column;align-items:center}.wp-step b{font-family:var(--display);font-size:52px;font-weight:900;font-stretch:110%;line-height:1;font-variant-numeric:tabular-nums}.wp-step span{font-size:13px;color:var(--muted)}
.wp-num{all:unset;box-sizing:border-box;width:150px;text-align:center;font-family:var(--display);font-size:52px;font-weight:900;font-stretch:110%;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg);border-radius:12px;border-bottom:2px dashed var(--line);-moz-appearance:textfield}
.wp-num::-webkit-outer-spin-button,.wp-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wp-num:focus{background:var(--sunk);border-bottom-color:var(--accent)}
.wp-rir{display:flex;align-items:center;gap:6px}.wp-rir .small{width:72px;line-height:1.2}
.wp-rir button{flex:1;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700}
.wp-rir button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.player{padding-bottom:0}.player>.wp-body:last-child{padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
.wp-foot{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;gap:8px;margin:auto calc(-1*max(18px,env(safe-area-inset-right,0px))) 0;padding:10px max(18px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.wp-foot .spread .btn{padding-top:4px;padding-bottom:4px}
.wp-foot.zoomed{position:fixed;left:0;top:0;bottom:auto;margin:0;transform-origin:0 0;box-sizing:border-box}
.wp-big{border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;min-height:64px;font-weight:850;font-stretch:112%;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.wp-big svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6}

nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90vw;display:flex;align-items:center;gap:12px}
.toast[hidden]{display:none}
.toast .undo{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px 2px;font-size:13.5px}
/* meals */
.mealpick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mealpick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600;font-size:12.5px}
.mealpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip .muted{font-weight:500}
.mealgrp{display:flex;flex-direction:column;padding-top:10px;border-top:1px solid var(--line)}
.mealgrp:first-child{border-top:0;padding-top:0}
.mealgrp .food:first-of-type{border-top:0}
.fbtns{display:flex;align-items:center;gap:0;flex:none}
.star{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 6px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--carb)}
@media (prefers-reduced-motion:no-preference){.dot{transition:background .15s}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="restbar" id="restbar" role="timer" aria-live="off" hidden></div>
<div id="viewerRoot"></div>
<div id="sheetRoot"></div>
<input type="file" id="phIn" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="lookIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<input type="file" id="reportIn" accept="application/json,.json" hidden>
<input type="file" id="progIn" accept=".csv,.json,.txt,text/csv,application/json" hidden>

<script>
(function(){
const MAC = {
  kcal:{label:"Calories",unit:"kcal",c:"var(--accent)"},
  protein:{label:"Protein",unit:"g",c:"var(--protein)"},
  carbs:{label:"Carbs",unit:"g",c:"var(--carb)"},
  fat:{label:"Fat",unit:"g",c:"var(--fat)"}
};
const MK = Object.keys(MAC), GK=["protein","carbs","fat"];
const DEFAULT_TARGETS={kcal:2400,protein:180,carbs:240,fat:80};
const DEFAULT_SETTINGS = {type:"settings",targets:DEFAULT_TARGETS,
  habits:["50 bodyweight reps","2 litres of water","8,000+ steps","7+ hours sleep","Protein at every meal"]};
const macroKcal=t=>Math.round((+t.protein||0)*4+(+t.carbs||0)*4+(+t.fat||0)*9);

const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const _ad=new Map(),addDays=(k,n)=>{const key=k+"|"+n;let v=_ad.get(key);if(v===undefined){const [y,m,d]=k.split("-").map(Number);v=keyOf(new Date(y,m-1,d+n));if(_ad.size>20000)_ad.clear();_ad.set(key,v)}return v};
const _fd=new Map(),_fdF=new Intl.DateTimeFormat("en-GB",{weekday:"short",day:"numeric",month:"short"}),fmtDay=k=>{let v=_fd.get(k);if(v===undefined){const [y,m,d]=String(k).split("-").map(Number);v=_fdF.format(new Date(y,m-1,d));_fd.set(k,v)}return v};
const half=n=>Math.round(n*2)/2;
const fmtN=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S = {tab:"today",day:todayKey(),docs:{},example:true,db:null,col:null,sample:null,
  results:[],searching:false,searchMsg:"",draftWorkout:null,ciDraft:null,showTargets:false,editFood:null};

/* ---------- example data shown until the first real entry ---------- */
function exampleDocs(){
  const t=todayKey(), docs={settings:DEFAULT_SETTINGS};
  docs["day_"+t]={type:"day",date:t,habits:{"Protein at every meal":true,"2 litres of water":true},
    foods:[{name:"3 scrambled eggs + 1 slice wholemeal toast",kcal:330,protein:22,carbs:16,fat:19},
           {name:"Chicken breast, rice & broccoli",kcal:520,protein:45,carbs:60,fat:9},
           {name:"Greek yoghurt 0% (170g) + berries",kcal:140,protein:17,carbs:15,fat:0}]};
  const w=[83.4,83.1,82.9,83.0,82.6,82.4,82.1];
  w.forEach((kg,i)=>{const k=addDays(t,-(6-i)*7);docs["body_"+k]={type:"body",date:k,weight:kg,waist:i===6?88:(i===0?91:null)}});
  docs["wo_ex1"]={type:"workout",date:addDays(t,-1),name:"Lower A",exercises:[
    {name:"Back squat",sets:[{kg:80,reps:8},{kg:80,reps:8},{kg:80,reps:7}]},
    {name:"Romanian deadlift",sets:[{kg:70,reps:10},{kg:70,reps:10}]}]};
  const ck=addDays(t,-((new Date().getDay()+6)%7));
  docs["ci_"+ck]={type:"checkin",date:ck,adherence:4,energy:4,sleep:3,stress:2,hunger:3,win:"Hit protein every day",struggle:"Late snacking Thursday",focus:"Pre-plan evening snack"};
  return docs;
}
S.docs=exampleDocs();

/* ---------- storage ---------- */
/* ---------- users on this device: each has their own data ---------- */
const PKEY="pf-profiles";
let PROF=(()=>{try{const p=JSON.parse(localStorage.getItem(PKEY)||"null");if(p&&p.list&&p.list.length)return p}catch(e){}
  // first run with users: the existing data becomes the first user's
  const p={list:[{id:"main",name:"Me"}],active:"main"};
  try{const old=localStorage.getItem("hpc-docs");if(old&&!localStorage.getItem("hpc-docs:main"))localStorage.setItem("hpc-docs:main",old);
    const ol=localStorage.getItem("pf-look");if(ol&&!localStorage.getItem("pf-look:main"))localStorage.setItem("pf-look:main",ol);
    localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){}
  return p})();
const saveProf=()=>{try{localStorage.setItem(PKEY,JSON.stringify(PROF))}catch(e){}};
const activeProf=()=>PROF.list.find(x=>x.id===PROF.active)||PROF.list[0];
const dataKey=id=>"hpc-docs:"+(id||PROF.active);
function loadLocal(){try{const r=localStorage.getItem(dataKey());if(r){const d=JSON.parse(r);if(Object.keys(d).length){S.docs=d;S.example=false}}}catch(e){}}
function saveLocal(){bumpDocs();try{localStorage.setItem(dataKey(),JSON.stringify(S.docs))}catch(e){toast("Couldn't save. This phone's storage may be full.")}}
const timers={};
function save(id,data){
  if(S.example){S.docs={settings:S.docs.settings||DEFAULT_SETTINGS};S.example=false;
    if(S.col){S.col.doc("settings").set(clone(S.docs.settings)).catch(()=>{})}}
  if(data&&typeof data==="object")data._t=Date.now();
  S.docs[id]=data;bumpDocs();render();window.Cloud&&Cloud.queue(id);
  if(S.col){clearTimeout(timers[id]);timers[id]=setTimeout(()=>{S.col.doc(id).set(clone(data)).catch(e=>toast("Couldn't save: "+(e&&e.message||"try again"))).finally(()=>{delete timers[id]})},500)}
  else saveLocal();
}
function remove(id){delete S.docs[id];bumpDocs();window.Cloud&&Cloud.markDeleted(id);render();if(S.col){S.col.doc(id).delete().catch(()=>toast("Couldn't delete, try again"))}else saveLocal()}
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg,opt){const t=document.getElementById("toast");t.innerHTML="";const sp=document.createElement("span");sp.textContent=msg;t.appendChild(sp);
  if(opt&&opt.undo){const b=document.createElement("button");b.className="undo";b.type="button";b.textContent="Undo";b.onclick=()=>{t.hidden=true;opt.undo();toast("Undone")};t.appendChild(b)}
  t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,opt&&opt.undo?6000:2600)}
// put a doc back exactly as it was (for Undo)
function restoreDoc(id,prev){if(prev)save(id,prev);else remove(id)}

const settings=()=>{const s=S.docs.settings||DEFAULT_SETTINGS;return (s.targets&&s.targets.kcal!=null)?s:{...s,targets:DEFAULT_TARGETS}};
function dayDoc(k){return S.docs["day_"+k]||{type:"day",date:k,foods:[],habits:{}}}
// the day to change: a clean one while example data is showing, so your first entry replaces the examples
function editDay(){return S.example?{type:"day",date:S.day,foods:[],habits:{}}:clone(dayDoc(S.day))}
// habits-only mode hides calorie and macro numbers everywhere (for anyone better off not counting)
const NUM=()=>!(S.docs.profile&&S.docs.profile.habitsOnly);
const kcalFloor=sex=>sex==="f"?1200:sex==="m"?1500:1350;
function lowKcalWarn(kcal,sex){const f=kcalFloor(sex);if(!(+kcal>0)||+kcal>=f)return"";
  return `<div class="hint small"><b>That's below the usual safe minimum of ${f.toLocaleString("en-GB")} kcal a day.</b><span>Very low targets can harm health, energy and training. Only use them with your coach or a health professional's guidance.</span></div>`}
const ML=()=>{const m=macroLeft();return m?" · "+m:""};
function macroLeft(){if(!NUM())return "";const t=totals(dayDoc(S.day)),tg=settings().targets,l=Math.round(tg.kcal-t.kcal),p=Math.round(tg.protein-t.protein);
  return (l>=0?l.toLocaleString("en-GB")+" kcal left":Math.abs(l).toLocaleString("en-GB")+" kcal over")+(p>0?", "+p+"g protein to go":", protein hit")}
function totals(d){const t={kcal:0,protein:0,carbs:0,fat:0};(d.foods||[]).forEach(f=>MK.forEach(k=>t[k]+=+f[k]||0));return t}
// lookups are cached until the data changes (or the next redraw), so screens stay quick with years of history
let DOCV=0;const bumpDocs=()=>{DOCV++};const memo=(fn)=>{let v=-1,c=new Map();return k=>{if(v!==DOCV){v=DOCV;c=new Map()}if(!c.has(k))c.set(k,fn(k));return c.get(k)}};
const ofTypeRaw=t=>Object.entries(S.docs).filter(([,d])=>d&&d.type===t).map(([id,d])=>({id,...d})).sort((a,b)=>a.date<b.date?1:-1);
const ofTypeM=memo(ofTypeRaw),ofType=t=>ofTypeM(t).slice();

/* ---------- render ---------- */
const ICONS={
  today:'<svg viewBox="0 0 24 24"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V11M16 11V7a1.5 1.5 0 0 1 3 0v6.5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.4-2.9L4 14.4a1.5 1.5 0 0 1 2.4-1.8L7 13.5"/></svg>',
  train:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
  body:'<svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>',
  checkin:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 13l3 3 5-6"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
const TABS=[["today","Today"],["train","Train"],["add",""],["recover","Recover"],["you","You"]];
ICONS.you='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
ICONS.recover='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M8.5 11.5h2l1-2 1.5 4 1-2h1.5"/></svg>';
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>k==="add"?`<div class="addslot"><button class="addbtn" data-act="quickSheet" aria-label="Quick log" aria-expanded="${!!S.sheet}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>`
  :`<button data-tab="${k}" ${S.tab===k||(k==="you"&&S.tab==="settings")?'aria-current="page"':""}>${ICONS[k]}${l}</button>`).join("")}

function exampleBanner(){return S.example?`<div class="banner"><span>Showing example data. Your first entry replaces it.</span><button class="btn ghost" data-act="clearEx">Start fresh</button></div>`:""}

function foodForm(f,i){if(!NUM())setTimeout(()=>document.querySelectorAll('form[data-form="food"] .macrof').forEach(e=>e.hidden=true),0);
  const v=k=>f&&f[k]!=null&&f[k]!==""?f[k]:"";
  return `<form class="editform" data-form="food" data-i="${i}">
    <label class="field wide"><span class="label">Food</span><input id="ef_name" value="${esc(v("name"))}" placeholder="e.g. Chicken wrap" required></label>
    <label class="field wide"><span class="label">Meal</span><select id="ef_meal">${MEALS.map(([k,l])=>`<option value="${k}" ${((f&&f.meal)||S.addTo||defaultMeal())===k?"selected":""}>${l}</option>`).join("")}</select></label>
    ${f&&f.base?(f.unit==="g"?`<label class="field wide"><span class="label">Amount eaten (g)</span><input id="ef_g" type="number" step="any" min="0" inputmode="decimal" value="${Math.round(f.qty)}" data-act="amtG"></label>`
      :`<label class="field ${f.unitG?"":"wide"}" style="${f.unitG?"grid-column:span 2":""}"><span class="label">Amount (× ${esc(f.unit)})</span><input id="ef_qty" type="number" step="any" min="0" inputmode="decimal" value="${f.qty}" data-act="amtQty"></label>
        ${f.unitG?`<label class="field" style="grid-column:span 2"><span class="label">Or grams</span><input id="ef_g" type="number" step="any" min="0" inputmode="decimal" value="${Math.round(f.qty*f.unitG)}" data-act="amtG"></label>`:""}`)
      +`<span class="small muted wide macrof">Change the amount and the macros below update to match.</span>`:""}
    <label class="field macrof"><span class="label">Protein g</span><input id="ef_protein" type="number" step="any" inputmode="decimal" value="${v("protein")}"></label>
    <label class="field macrof"><span class="label">Carbs g</span><input id="ef_carbs" type="number" step="any" inputmode="decimal" value="${v("carbs")}"></label>
    <label class="field macrof"><span class="label">Fat g</span><input id="ef_fat" type="number" step="any" inputmode="decimal" value="${v("fat")}"></label>
    <label class="field macrof"><span class="label">kcal</span><input id="ef_kcal" type="number" step="any" inputmode="numeric" value="${v("kcal")}" placeholder="auto"></label>
    <span class="small muted wide macrof">Leave calories blank to work them out from the macros.</span>
    <div class="acts"><button class="btn primary" type="submit">${i==="new"?"Add food":"Save changes"}</button><button class="btn" type="button" data-act="cancelFood">Cancel</button>${i!=="new"?`<button class="btn ghost" type="button" data-act="delFood" data-i="${i}">Delete</button>`:""}</div>
  </form>`}
function renderToday(){
  const d=dayDoc(S.day), st=settings(), tg=st.targets, tot=totals(d);
  const rows=MK.map(k=>{
    const v=Math.round(tot[k]),t=+tg[k]||0,pct=t?Math.min(100,v/t*100):0,left=t-v;
    return `<div class="macro" style="--c:${MAC[k].c}">
      <div class="pname"><b>${MAC[k].label}</b></div>
      <div class="count">${v.toLocaleString("en-GB")}<small> / ${t.toLocaleString("en-GB")}${MAC[k].unit==="g"?"g":""}</small></div>
      <div class="bar ${v>t&&t?"over":""}" role="progressbar" aria-label="${MAC[k].label}" aria-valuenow="${v}" aria-valuemax="${t}"><i style="width:${pct}%"></i></div>
      <div class="left">${left>=0?left.toLocaleString("en-GB")+(MAC[k].unit==="g"?"g":" kcal")+" left":Math.abs(left).toLocaleString("en-GB")+(MAC[k].unit==="g"?"g":" kcal")+" over"}</div>
    </div>`}).join("");
  const habits=st.habits.map((h,i)=>`<label class="habit"><input type="checkbox" id="hab${i}" data-act="habit" data-h="${esc(h)}" ${d.habits&&d.habits[h]?"checked":""}><span>${esc(h)}</span></label>`).join("");
  const done=st.habits.filter(h=>d.habits&&d.habits[h]).length;
  const foodRow=(f,i)=>S.editFood===i?foodForm(f,i):`<div class="food"><div style="min-width:0"><div class="nm">${esc(f.name)}</div>
    <div class="meta">${f.base&&f.qty!=null?fmtQty(f)+(NUM()?" · ":""):""}${NUM()?`${Math.round(+f.kcal||0)} kcal · P ${fmtN(+f.protein||0)}g · C ${fmtN(+f.carbs||0)}g · F ${fmtN(+f.fat||0)}g`:""}</div></div>
    <div class="fbtns"><button class="star" data-act="favFood" data-i="${i}" aria-pressed="${isFav(f)}" aria-label="${isFav(f)?"Remove from":"Add to"} favourites">${isFav(f)?"★":"☆"}</button><button class="btn ghost" data-act="editFood" data-i="${i}" aria-label="Edit ${esc(f.name)}">Edit</button></div></div>`;
  const all=(d.foods||[]).map((f,i)=>[f,i]),yd=dayDoc(addDays(S.day,-1));
  const grp=(k,l,items)=>{const kc=items.reduce((a,[f])=>a+(+f.kcal||0),0),yItems=k?(yd.foods||[]).filter(f=>f.meal===k):[];
    return `<div class="mealgrp"><div class="spread"><span><b>${l}</b> <span class="small muted">${items.length&&NUM()?Math.round(kc).toLocaleString("en-GB")+" kcal":""}</span></span>
      ${k?`<span class="row" style="gap:0;flex-wrap:nowrap">${!items.length&&yItems.length?`<button class="btn ghost" style="font-size:13px" data-act="copyMeal" data-m="${k}">Same as yesterday</button>`:""}<button class="btn ghost" data-act="addTo" data-m="${k}" data-focus="1" aria-label="Add to ${l}">+ Add</button></span>`:""}</div>
      ${items.map(([f,i])=>foodRow(f,i)).join("")}</div>`};
  const other=all.filter(([f])=>!MEALS.some(m=>m[0]===f.meal));
  const foods=MEALS.map(([k,l])=>grp(k,l,all.filter(([f])=>f.meal===k))).join("")+(other.length?grp(null,"Other",other):"");
  S.quick=quickFoods();
  const quick=S.quick.length?`<div class="label" style="margin-top:2px">Quick add</div><div class="chiprow">${S.quick.map((x,i)=>`<button class="qchip" data-act="quickAdd" data-i="${i}">${x.fav?"★ ":""}${esc(x.f.name)}${NUM()?` <span class="muted">${Math.round(+x.f.kcal||0)}</span>`:""}</button>`).join("")}</div>`:"";
  const results=S.results.map((r,i)=>`<div class="result"><div style="min-width:0"><div class="nm" style="font-weight:600">${esc(r.name)}${r.src?` <span class="srctag">${esc(r.src)}</span>`:""}</div>
    <div class="meta small muted">${r.serving?esc(r.serving):""}${NUM()?`${r.serving?" · ":""}${Math.round(r.kcal||0)} kcal · P ${Math.round(r.protein_g||0)}g · C ${Math.round(r.carbs_g||0)}g · F ${Math.round(r.fat_g||0)}g`:""}</div></div>
    <button class="btn primary" data-act="addRes" data-i="${i}">Add</button></div>`).join("");
  const isToday=S.day===todayKey(),dl=typeof deloadInfo==="function"?deloadInfo():null,rd=S.docs["ready_"+todayKey()],rsc=rd?readinessScore(rd):null;
  const nextMeal=MEALS.find(([k])=>!(d.foods||[]).some(f=>f.meal===k))||MEALS[3];
  const kL=Math.round((+tg.kcal||0)-tot.kcal);
  const nutrition=`<section class="panel nutri"><div class="spread" style="align-items:flex-end"><div><span class="small muted">Calories</span><div class="bignum">${Math.round(tot.kcal).toLocaleString("en-GB")}<small> / ${(+tg.kcal||0).toLocaleString("en-GB")}</small></div></div>
      <span class="small" style="color:var(--accent);font-weight:700">${kL>=0?kL.toLocaleString("en-GB")+" left":Math.abs(kL).toLocaleString("en-GB")+" over"}</span></div>
    <div class="bar"><i style="width:${Math.min(100,tg.kcal?tot.kcal/tg.kcal*100:0)}%;background:var(--accent)"></i></div>
    <div class="mini3">${["protein","carbs","fat"].map(k=>`<div><span class="small muted">${MAC[k].label}</span><b>${Math.round(tot[k])}<small> /${+tg[k]||0}g</small></b><div class="bar thin"><i style="width:${Math.min(100,tg[k]?tot[k]/tg[k]*100:0)}%;background:${MAC[k].c}"></i></div></div>`).join("")}</div>

/* ---------- progress insights ---------- */
// a personal best = this session's best set beats every earlier session of that exercise
function findPRs(w){const out=[];(w.exercises||[]).forEach(e=>{const h=exHistory(e.name);if(!h.length)return;const nb=bestSet(e.sets),old=Math.max(...h.map(x=>setScore(bestSet(x.sets))));

    if(h.length<4||h[0].date<cut)return;const sc=h.map(x=>setScore(bestSet(x.sets)));if(Math.max(...sc.slice(0,3))<=Math.max(...sc.slice(3)))out.push(e.name)}));return out}
const MAJOR=["Chest","Back","Shoulders","Quads","Hamstrings & glutes"];
function weeklySets(ws){const end=addDays(ws,6),g={};ofType("workout").filter(w=>w.date>=ws&&w.date<=end).forEach(w=>(w.exercises||[]).forEach(e=>{const k=LIB_GROUP[exKey(e.name)]||"Other";g[k]=(g[k]||0)+e.sets.length}));return g}
function deloadInfo(){const d=settings().deload;if(!d||!d.start)return null;const wk=Math.floor((new Date(weekStart())-new Date(d.start))/(7*864e5)),pos=((wk%d.every)+d.every)%d.every+1;return {pos,every:d.every,deload:pos===d.every,next:pos===d.every-1}}
function renderInsights(){const ws=weekStart(),wo=ofType("workout"),thisWk=wo.filter(w=>w.date>=ws),prs=thisWk.flatMap(w=>w.prs||[]),st=stalls(),sets=weeklySets(ws),dl=deloadInfo();

// calories = MET × bodyweight (kg) × hours; METs are mid-range Compendium of Physical Activities values per style
const MET={gym:5,bodyweight:4.5,functional:7,calisthenics:5.5};
const bodyKg=()=>latestWeight()||+(S.docs.profile||{}).weight||null;
// timed length when the session was run live; an estimate when it was typed in afterwards (under a minute a set)
function woMins(w){const sets=(w.exercises||[]).reduce((a,e)=>a+e.sets.length,0),parts=["warmup","cooldown"].reduce((a,p)=>a+(w[p]||[]).filter(x=>x.done).length,0);

const e1rmH=s=>Math.round(e1rm(s)*2)/2;

const fmtBig=n=>n>=10000?fmtN(Math.round(n/100)/10)+"k":Math.round(n).toLocaleString("en-GB");
// weight lifted counts kg × reps (added kg only on bodyweight moves); timed holds count seconds
function woStats(w){let sets=0,reps=0,vol=0,secs=0;(w.exercises||[]).forEach(e=>e.sets.forEach(s=>{sets++;if(s.secs!=null&&s.secs!=="")secs+=+s.secs||0;else{reps+=+s.reps||0;vol+=(+s.kg||0)*(+s.reps||0)}}));

function sumTiles(w,prs){const s=woStats(w),t=[glanceTile("Time",fmtDur(s.mins),""),glanceTile("Calories","≈"+s.kcal.toLocaleString("en-GB"),"kcal burnt")];
  t.push(s.vol?glanceTile("Weight lifted",s.vol.toLocaleString("en-GB"),"kg"):glanceTile("Reps",s.reps,"total"));
  t.push(glanceTile("Sets",s.sets,""));
  if(s.vol)t.push(glanceTile("Reps",s.reps,"total"));
  if(s.secs)t.push(glanceTile("Time held",mmss(s.secs),"timed holds"));
  t.push(glanceTile("PBs",prs.length,prs.length?"new 🏆":"this session"));

const kcalNote=()=>`<span class="small muted">Calories are an estimate from session length, training style and ${bodyKg()?"your weight ("+fmtN(bodyKg())+" kg)":"an average 75 kg body. Log a weigh-in in You › Body to make it yours"}.</span>`;
// the same exercise in the session before this one
const prevOf=(name,w)=>exHistory(name).find(x=>x.id!==w.id&&x.date<=w.date);
function vsLast(cur,prev){if(!prev)return {t:"First time",c:"muted"};const a=bestSet(cur),b=bestSet(prev);if(!a||!b)return {t:"",c:"muted"};
  let d,u;
  if(+a.kg>0&&!a.secs&&+b.kg>0&&!b.secs){d=e1rmH(a)-e1rmH(b);u=" kg est. 1RM"}
  else if(!(+a.kg)&&!(+b.kg)&&!!a.secs===!!b.secs){d=a.secs?+a.secs-+b.secs:+a.reps-+b.reps;u=a.secs?"s":" reps"}

function renderWoSummary(w){const prs=w.prs||[],fresh=S.woSumFresh;

// one value per session for the progress chart: est. 1RM for weighted lifts, else best reps or hold
function exMetric(h){const b=bestSet(h[0].sets);

function exChart(h,M){const pts=h.slice(0,20).reverse().map(x=>({date:x.date,v:M.val(x)})).filter(p=>p.v!=null);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${M.label} over time">${ticks}

    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtDay(pts[0].date)}</text><text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtDay(pts[pts.length-1].date)}</text></svg>`}
function weekBars(wo){const ws=weekStart(),weeks=[...Array(8)].map((_,i)=>addDays(ws,-7*(7-i)));

  const useVol=data.some(d=>d.vol),val=d=>useVol?d.vol:d.reps,max=Math.max(1,...data.map(val));

    <text x="${(x+bw/2).toFixed(1)}" y="${H-B+13}" font-size="9.5" text-anchor="middle" fill="var(--muted)">${fmtDay(d.s).replace(/^\w+, /,"")}</text>

// The five wellness items used in sport science (McLean et al. 2010; World Rugby), each 1–5. Soreness and stress are "higher = worse".
const RQ=[["sleepQ","Sleep quality","Poor","Great"],["energy","Energy","Drained","Full of energy"],["soreness","Muscle soreness","None","Very sore"],["stress","Stress","Calm","Very stressed"],["mood","Mood","Low","Great"]];
const RQ_INV={soreness:1,stress:1};
const rqVal=(r,k)=>r&&r[k]?(RQ_INV[k]?(5-r[k])/4:(r[k]-1)/4):null;
function wellnessOf(r){const v=RQ.map(([k])=>rqVal(r,k)).filter(x=>x!=null);return v.length?v.reduce((a,x)=>a+x,0)/v.length*100:null}
const sleepAdj=h=>!(+h>0)?0:h<5?-12:h<6?-8:h<7?-4:0;
// readiness 0–100: wellness questionnaire + sleep hours, compared with your own normal once there's enough history
const readyMemo=memo(k=>readinessDetailRaw(S.docs["ready_"+k]));
function readinessDetail(r){if(!r)return null;if(r.date&&S.docs["ready_"+r.date]===r)return readyMemo(r.date);return readinessDetailRaw(r)}
function readinessDetailRaw(r){if(!r)return null;const w=wellnessOf(r);if(w==null)return null;const date=r.date||todayKey(),hist=[];
  for(let i=1;i<=28;i++){const x=S.docs["ready_"+addDays(date,-i)],v=x&&wellnessOf(x);if(v!=null)hist.push(v)}
  const abs=Math.max(0,Math.min(100,20+w*0.8+sleepAdj(r.sleepH)));let z=null,adj=0,mean=null;
  if(hist.length>=7){mean=hist.reduce((a,x)=>a+x,0)/hist.length;const sd=Math.max(6,Math.sqrt(hist.reduce((a,x)=>a+(x-mean)**2,0)/(hist.length-1)));z=(w-mean)/sd;adj=Math.max(-10,Math.min(10,z*5))}
  let score=Math.round(Math.max(0,Math.min(100,abs+adj)));if(r.pain)score=Math.min(score,50);
  const parts=RQ.map(([k,l])=>({k,l,v:rqVal(r,k)}));
  return {score,wellness:Math.round(20+w*0.8),sleep:sleepAdj(r.sleepH),z,mean:mean!=null?Math.round(20+mean*0.8):null,n:hist.length,parts,pain:!!r.pain,sleepH:+r.sleepH||0}}
function readinessScore(r){const d=readinessDetail(r);return d?d.score:null}
function readinessAdvice(sc,pain){if(sc==null)return null;

    :sc>=65?["Good to go","You're well recovered. Train as planned and push your working sets.","var(--veg)"]
    :sc>=50?["Train smart","Solid enough to train. Keep the plan, but let today's warm-up sets decide your weights.","var(--accent)"]
    :sc>=35?["Go lighter","Your body's asking for a lighter day. Showing up still counts, and you'll recover faster for it.","var(--carb)"]
    :["Recovery day","Today's job is recovery. Rest is when the gains from your training actually happen.","var(--protein)"];
  if(pain)a[1]+=" You flagged pain, so avoid anything that makes it worse.";return a}
function readinessPlan(sc,pain){if(sc==null)return[];
  const p=sc>=80?["Work up to a heavy top set at 1 rep in reserve, then your back-off sets","Good day to try for a rep or a little more weight on your main lift","Full session, full rest periods"]

  const M=[["weight","Weight (kg)"]].concat(coach?MEAS.map(([k,l])=>[k,l+" (cm)"]):[]);
  return `<div class="stack"><section class="panel"><h2>Weight trend</h2>${weightStats(list)}${weightChart(list)}
    <span class="small muted">Daily weight jumps around with water, salt and food in your gut. Judge progress by the 7-day average line.</span></section>
  ${photoPanel()}
  <section class="panel"><h2>${coach?"New entry":"Log a weigh-in"}</h2><form id="bodyForm" class="stack" style="gap:10px">
    <label class="field"><span class="label">Date</span><input type="date" id="bDate" value="${todayKey()}"></label>
    <div class="grid2">${M.map(([k,l])=>`<label class="field"><span class="label">${l}</span><input type="number" step="0.1" inputmode="decimal" id="b_${k}"></label>`).join("")}</div>
    <button class="btn primary" type="submit">Save entry</button></form></section>
  <section class="panel"><h2>History</h2><div class="hist">${(S.bodyAll?list:list.slice(0,10)).map(b=>`<div class="item"><div class="spread"><b style="font-variant-numeric:tabular-nums">${b.weight?fmtN(+b.weight)+" kg":"—"}</b><span class="small muted">${fmtDay(b.date)}</span></div>
    <div class="spread"><span class="small muted">${coach?MEAS.filter(([k])=>b[k]).map(([k,l])=>l+" "+b[k]+" cm").join(" · ")||"&nbsp;":"&nbsp;"}</span><button class="x" data-act="delBody" data-id="${b.id}" aria-label="Delete entry">×</button></div></div>`).join("")||'<p class="muted small" style="margin:0">No entries yet.</p>'}</div>${list.length>10?`<button class="btn ghost" style="align-self:flex-start" data-act="bodyAll">${S.bodyAll?"Show fewer":"Show all "+list.length}</button>`:""}</section></div>`;
}

const CQ=[
  ["adherence","Sticking to the plan","How closely did you follow your training and nutrition plan?","Barely","Nailed it"],
  ["motivation","Motivation","How driven did you feel to train and eat well?","Running on empty","Fired up"],
  ["energy","Energy","How were your energy levels day to day?","Drained","Full of energy"],
  ["sleep","Sleep","How well did you sleep?","Poorly","Really well"],
  ["stress","Stress","How stressed did you feel?","Calm","Very stressed"],
  ["hunger","Appetite & cravings","How hard were hunger and cravings to manage?","Easy","Very hard"],
  ["foodrel","Food & body","How relaxed did you feel around food and your body this week?","Very anxious","Relaxed"]];
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function glanceTile(label,val,sub,tone){return `<div class="tile"><span class="label">${label}</span><b>${val}</b>${sub?`<span class="small ${tone||"muted"}">${sub}</span>`:""}</div>`}
function weekGlance(ws){let tiles2;const tw=weekSummary(ws,false),lw=weekSummary(addDays(ws,-7),false),tg=settings().targets;
  const wd=tw.weight!=null&&lw.weight!=null?r1(tw.weight-lw.weight):null;
  const tiles=NUM()?null:[
    glanceTile("Weight kg",tw.weight!=null?fmtN(tw.weight):"—",wd!=null?(wd>0?"+":"")+fmtN(wd)+" kg vs last week":"log a weigh-in"),
    glanceTile("Days logged",tw.daysLogged+"/7","food diary"),
    glanceTile("Habits",tw.habitsPct!=null?tw.habitsPct+"%":"—","of daily ticks"),
    glanceTile("Sessions",tw.sessions,"training")];
  if(!tiles)tiles2=[
    glanceTile("Weight kg",tw.weight!=null?fmtN(tw.weight):"—",wd!=null?(wd>0?"+":"")+fmtN(wd)+" kg vs last week":tw.weight!=null?"first weigh-in week":"log a weigh-in"),
    glanceTile("Avg calories",tw.kcal!=null?tw.kcal.toLocaleString("en-GB"):"—",tw.kcal!=null?"target "+Number(tg.kcal).toLocaleString("en-GB"):"no food logged"),
    glanceTile("Avg protein",tw.protein!=null?tw.protein+"g":"—",tw.protein!=null?(tw.protein>=tg.protein*.9?"on target":"target "+tg.protein+"g"):"",tw.protein!=null&&tw.protein>=tg.protein*.9?"good":"muted"),
    glanceTile("Days on target",tw.daysLogged?`${tw.onTarget||0}/${tw.daysLogged}`:"—",tw.daysLogged?`${tw.daysLogged} day${tw.daysLogged===1?"":"s"} logged`:""),
    glanceTile("Habits",tw.habitsPct!=null?tw.habitsPct+"%":"—","of daily ticks"),
    glanceTile("Sessions",tw.sessions,tw.volume?tw.volume.toLocaleString("en-GB")+" kg volume":"training")];
  return `<section class="panel"><div class="spread"><h2>Your week so far</h2><span class="label">auto</span></div><div class="tiles">${(tiles||tiles2).join("")}</div></section>`}
function renderCheckin(){
  const list=ofType("checkin"),ws=weekStart();
  if(!S.ciDraft){const ex=S.docs["ci_"+ws];S.ciDraft=ex&&!S.example?clone(ex):{type:"checkin",date:ws}}
  const c=S.ciDraft,prev=S.docs["ci_"+addDays(ws,-7)],done=CQ.filter(([k])=>c[k]).length;
  if(unreadFeedback())setTimeout(()=>{const f=unreadFeedback();if(f&&S.tab==="you")lsSet("pf-fbseen:"+PROF.active,f.at)},1500);
  return `<div class="stack">
  ${coachFeedbackCards(2)}
  ${prev&&prev.focus?`<section class="panel focusnote"><span class="label">Last week you said you'd focus on</span><p style="margin:0;font-weight:600">${esc(prev.focus)}</p></section>`:""}
  ${weekGlance(ws)}
  <section class="panel"><div class="spread"><h2>How did it go?</h2><span class="label">${done}/${CQ.length}</span></div>
    ${CQ.map(([k,l,q,lo,hi])=>`<div class="ciq"><div><b>${l}</b><div class="small muted">${q}</div></div>
      <div class="scale" role="group" aria-label="${l}">${[1,2,3,4,5].map(n=>`<button data-act="ciScale" data-k="${k}" data-n="${n}" aria-pressed="${c[k]===n}">${n}</button>`).join("")}</div>
      <div class="anchors"><span>1 · ${lo}</span><span>${hi} · 5</span></div>
      ${k==="foodrel"&&c.foodrel&&c.foodrel<=2?`<div class="hint small"><b>Thanks for being honest. That sounds hard.</b><span>It's worth talking to your coach or GP. Beat, the UK eating disorder charity, offers free, confidential support at beateatingdisorders.org.uk. You can also switch on habits-only mode in Settings → Targets & habits to hide calorie numbers.</span></div>`:""}</div>`).join("")}</section>
  <section class="panel"><h2>Reflect</h2>
    <label class="field"><span class="label">Biggest win this week</span><textarea id="ci_win" data-act="ciText" data-k="win" placeholder="e.g. Hit my protein 6 days out of 7">${esc(c.win)}</textarea></label>
    <label class="field"><span class="label">What got in the way?</span><textarea id="ci_struggle" data-act="ciText" data-k="struggle" placeholder="e.g. Late finishes at work, skipped Thursday">${esc(c.struggle)}</textarea></label>
    <label class="field"><span class="label">One focus for next week</span><textarea id="ci_focus" data-act="ciText" data-k="focus" placeholder="e.g. Prep lunches on Sunday">${esc(c.focus)}</textarea></label>
    <button class="btn primary" data-act="saveCi">${S.docs["ci_"+ws]&&!S.example?"Update check-in":"Save check-in"}</button></section>
  ${sharePanel()}
  <section class="panel"><h2>Past check-ins</h2><div class="hist">${list.map(x=>`<div class="item"><div class="spread"><b>${fmtDay(x.date)}</b><button class="x" data-act="delCi" data-id="${x.id}" aria-label="Delete check-in">×</button></div>
    <div class="small muted" style="font-variant-numeric:tabular-nums">${CQ.filter(([k])=>x[k]).map(([k,l])=>l.split(" ")[0]+" "+x[k]+"/5").join(" · ")}</div>
    ${x.win?`<div class="small"><b>Win:</b> ${esc(x.win)}</div>`:""}${x.struggle?`<div class="small"><b>Struggle:</b> ${esc(x.struggle)}</div>`:""}${x.focus?`<div class="small"><b>Focus:</b> ${esc(x.focus)}</div>`:""}</div>`).join("")||'<p class="muted small" style="margin:0">No check-ins yet.</p>'}</div></section></div>`;
}

/* workout mode: keep your place on screen when anything changes, and keep the bottom controls pinned (also when pinch-zoomed) */
const wpScreenKey=()=>[S.wp?S.wp.step:0,S.rest?"r":"",S.hold?"h":"",S.wpEnd?"e":"",S.idlePrompt?"i":"",S.wu?"w"+S.wu.idx+"."+((S.wu.stages[S.wu.idx]||{}).pos||0):"",S.cdRun?"c":""].join("|");
function wpFocusKey(el){const d=el.dataset||{},a=["act","f","i","k","part","n"].filter(k=>d[k]!=null).map(k=>`[data-${k}="${CSS.escape(d[k])}"]`).join("");return el.id?"#"+CSS.escape(el.id):a?el.tagName.toLowerCase()+a:null}
function wpWrapFoot(pl){if(pl.querySelector(".wp-foot"))return;const kids=[...pl.children],bi=kids.map(k=>k.classList.contains("wp-body")).lastIndexOf(true);if(bi<0)return;const rest=kids.slice(bi+1);if(!rest.length)return;
  const f=document.createElement("div");f.className="wp-foot";rest.forEach(k=>f.appendChild(k));pl.appendChild(f)}
function wpPinFoot(){const f=document.querySelector(".player .wp-foot"),vv=window.visualViewport;if(!f)return;const pl=f.parentElement;
  if(!vv||vv.scale<1.02){if(f.classList.contains("zoomed")){f.classList.remove("zoomed");f.style.transform="";f.style.width="";pl.style.paddingBottom=""}return}
  const lw=document.documentElement.clientWidth,s=vv.scale;f.classList.add("zoomed");f.style.width=lw+"px";const h=f.offsetHeight;pl.style.paddingBottom=h+"px";
  f.style.transform=`translate(${vv.offsetLeft}px,${vv.offsetTop+vv.height-h/s}px) scale(${1/s})`}
if(window.visualViewport){let raf=0;const on=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(wpPinFoot)};visualViewport.addEventListener("resize",on);visualViewport.addEventListener("scroll",on)}
function render(){bumpDocs();
  if(typeof persistDraft==="function")persistDraft();
  const tb=document.getElementById("tabs");
  if(S.lock){tb.hidden=true;document.getElementById("app").innerHTML=renderLock();return}
  if(gateOn()){tb.hidden=true;const fe=document.activeElement,fid=fe&&fe.id,sel=fe&&fe.selectionStart;document.getElementById("app").innerHTML=renderGate();if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}return}
  if(S.onboard){tb.hidden=true;const fe=document.activeElement,fid=fe&&fe.id;document.getElementById("app").innerHTML=renderOnboard();if(fid){const el=document.getElementById(fid);if(el)el.focus()}return}
  tb.hidden=false;
  if(S.tab==="body"||S.tab==="checkin"){S.youView=S.tab==="body"?"body":"checkin";S.tab="you"}
  document.getElementById("sheetRoot").innerHTML=S.sheet?quickSheet():"";
  if(playerOn()){tb.hidden=true;const vr=document.getElementById("viewerRoot"),op=vr.querySelector(".player"),fe=document.activeElement,fk=op&&fe&&op.contains(fe)?wpFocusKey(fe):null,sel=fk?fe.selectionStart:null;
    S._wpScroll=S._wpScroll||{};if(op&&S._wpKey)S._wpScroll[S._wpKey]=op.scrollTop;
    vr.innerHTML=workoutPlayer();const np=vr.querySelector(".player"),key=wpScreenKey();S._wpKey=key;
    if(np){wpWrapFoot(np);np.scrollTop=S._wpScroll[key]||0;if(fk){const el=np.querySelector(fk);if(el){el.focus({preventScroll:true});try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}wpPinFoot()}
    document.getElementById("restbar").hidden=true;return}
  document.getElementById("viewerRoot").innerHTML=S.tab==="you"&&S.youView==="body"?photoViewer():S.routine?routineRunner():"";
  renderTabs();
  const app=document.getElementById("app");
  const fe=document.activeElement, fid=fe&&fe.id, sel=fe&&fe.selectionStart;
  const qv=document.getElementById("q")?.value;
  // keep anything typed into an open food form when the page redraws (e.g. a search finishing)
  const ff=document.querySelector('form[data-form="food"]'),keep=ff?{i:ff.dataset.i,v:[...ff.querySelectorAll("input")].map(x=>[x.id,x.value])}:null;
  app.innerHTML=S.tab==="today"?renderToday():S.tab==="train"?renderTrain():S.tab==="recover"?renderRecover():S.tab==="you"?renderYou():renderSettings();
  if(qv&&document.getElementById("q"))document.getElementById("q").value=qv;
  if(keep){const nf=document.querySelector(`form[data-form="food"][data-i="${keep.i}"]`);if(nf)keep.v.forEach(([id,v])=>{const el=id&&document.getElementById(id);if(el)el.value=v})}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}

const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,half:0.5,"½":0.5,quarter:0.25,couple:2};
const r1=n=>Math.round(n*10)/10;
function scaleFood(base,qty){const o={};["kcal","protein","carbs","fat"].forEach(k=>o[k]=k==="kcal"?Math.round(base[k]*qty):r1(base[k]*qty));return o}
function matchFood(part){let best=null,len=0;
  FOOD_DB.forEach(f=>f.words.forEach(w=>{const re=new RegExp("(^|[^a-z])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(e?s)?($|[^a-z])");if(w.length>len&&re.test(part)){best=f;len=w.length}}));return best}
// "2 eggs and beans on toast" -> [{food, qty}], plus parts it couldn't match
function estimateMeal(q){const parts=q.toLowerCase().replace(/[()]/g," ").split(/\s*(?:,|\+|&|\band\b|\bwith\b|\bon\b|\bplus\b)\s*/).map(x=>x.trim()).filter(Boolean);
  const items=[],missed=[];
  parts.forEach(pt=>{const f=matchFood(pt);if(!f){missed.push(pt);return}
    let qty=1,m;
    if((m=pt.match(/(\d+(?:\.\d+)?)\s*(g|grams?|ml)\b/)))qty=+m[1]/f.unitG;
    else if((m=pt.match(/^(\d+(?:\.\d+)?)\s*x?\b/))||(m=pt.match(/\bx\s*(\d+(?:\.\d+)?)\b/)))qty=+m[1];
    else if((m=pt.match(/^(a|an|one|two|three|four|five|six|half|½|quarter|couple)\b/)))qty=NUMW[m[1]];
    items.push({name:f.name,unit:f.unit,unitG:f.unitG,base:f.per,qty:r1(qty)})});
  return items.length?{q,items,missed}:null}
const mealTotals=items=>items.reduce((t,it)=>{const s=scaleFood(it.base,it.qty);Object.keys(t).forEach(k=>t[k]+=s[k]);return t},{kcal:0,protein:0,carbs:0,fat:0});
const fmtQty=it=>it.unit==="g"?`${Math.round(it.qty)}g`:`${fmtN(it.qty)} × ${it.unit}`;
function mealCard(){const M=S.meal;if(!M)return"";const t=mealTotals(M.items);
  return `<div class="meal"><div class="spread"><span class="label">Quick estimate</span><span class="small" style="font-variant-numeric:tabular-nums">${NUM()?`<b>${Math.round(t.kcal)} kcal</b> · P ${Math.round(t.protein)} · C ${Math.round(t.carbs)} · F ${Math.round(t.fat)}`:""}</span></div>
    ${M.items.map((it,i)=>{const s=scaleFood(it.base,it.qty);return `<div class="mrow"><div style="min-width:0"><div style="font-weight:600">${esc(it.name)}</div><div class="small muted">${fmtQty(it)}${NUM()?` · ${s.kcal} kcal · P ${fmtN(s.protein)}g`:""}</div></div>
      <div class="steppers" style="grid-column:auto"><button data-act="mealQty" data-i="${i}" data-d="-0.5" aria-label="Less ${esc(it.name)}">−</button><button class="add" style="--c:var(--accent)" data-act="mealQty" data-i="${i}" data-d="0.5" aria-label="More ${esc(it.name)}">+</button></div></div>`}).join("")}
    ${M.missed.length?`<div class="small muted">Not in the quick list: ${M.missed.map(esc).join(", ")}. Check the online results below, or add it manually.</div>`:""}
    <div class="row"><button class="btn primary" data-act="addMeal">Add ${M.items.length>1?"all "+M.items.length+" items":"it"}</button><button class="btn ghost" data-act="clearMeal">Dismiss</button></div></div>`}

const isFav=f=>(settings().favs||[]).some(x=>exKey(x.name)===exKey(f.name));

function quickFoods(){const favs=settings().favs||[],seen=new Set(favs.map(f=>exKey(f.name))),cnt=new Map();
  for(let i=0;i<21;i++){const dd=S.docs["day_"+addDays(todayKey(),-i)];((dd&&dd.foods)||[]).forEach(f=>{const k=exKey(f.name);if(!k||seen.has(k))return;const c=cnt.get(k);if(c)c.n++;else cnt.set(k,{n:1,f})})}
  const rec=[...cnt.values()].sort((a,b)=>b.n-a.n).slice(0,Math.max(0,12-favs.length)).map(x=>({f:x.f,fav:false}));
  return [...favs.map(f=>({f,fav:true})),...rec]}

rt gets painful is the man who will win.", "Roger Bannister"], ["The moment of victory is much too short to live for that and nothing else.", "Martina Navratilova"], ["Ability is what you're capable of doing. Motivation determines what you do. Attitude determines how well you do it.", "Lou Holtz"], ["Success isn't always about greatness. It's about consistency. Consistent hard work leads to success. Greatness will come.", "Dwayne Johnson"], ["You are in danger of living a life so comfortable and soft, that you will die without ever realising your true potential.", "David Goggins"], ["Knowing is not enough, we must apply. Willing is not enough, we must do.", "Bruce Lee"], ["Pain is inevitable. Suffering is optional.", "Haruki Murakami"], ["We are what we repeatedly do. Excellence, then, is not an act, but a habit.", "Will Durant, on Aristotle"], ["Waste no more time arguing about what a good man should be. Be one.", "Marcus Aurelius"], ["We suffer more often in imagination than in reality.", "Seneca"], ["No man is free who is not master of himself.", "Epictetus"], ["The journey of a thousand miles begins with a single step.", "Lao Tzu"], ["Discipline is the bridge between goals and accomplishment.", "Jim Rohn"], ["Take care of your body. It's the only place you have to live.", "Jim Rohn"], ["Strength does not come from physical capacity. It comes from an indomitable will.", "Mahatma Gandhi"], ["It is not the mountain we conquer, but ourselves.", "Sir Edmund Hillary"], ["Hard work beats talent when talent doesn't work hard.", "Tim Notke"], ["The difference between the impossible and the possible lies in a person's determination.", "Tommy Lasorda"], ["It's not whether you get knocked down; it's whether you get up.", "Vince Lombardi"], ["Make each day your masterpiece.", "John Wooden"]];

// measurements a coach takes in person; stored in the coach's own data, never in the client's app

function clientCsv(id){const c=S.docs[id];if(!c)return;const cols=[...CLIENT_COLS.slice(1).map(x=>[x[0],x[1]]),["hips","Hips cm"],["chest","Chest cm"],["arm","Arm cm"],["thigh","Thigh cm"],["sets","Sets"],["win","Win"],["struggle","Struggle"],["focus","Focus"]];
  const q=v=>v==null?"":/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  const csv=[["Week starting",...cols.map(x=>x[1])].join(","),...c.weeks.map(w=>[w.week,...cols.map(x=>q(w[x[0]]))].join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${String(c.name).replace(/[^a-z0-9]+/gi,"-").toLowerCase()}-progress.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}


/* ---------- first-run setup ---------- */
const HABIT_IDEAS=["Protein at every meal","2 litres of water","8,000+ steps","7+ hours sleep","Ate slowly, stopped at 80% full","10 minutes of mobility","No alcohol","Fruit or veg with every meal"];
function needsOnboarding(){const p=S.docs.profile||{};return !p.onboarded&&!Object.values(S.docs).some(d=>d&&["day","workout","body","checkin"].includes(d.type))}
function afterLoad(){setTimeout(()=>Cloud.init(),0);if(S.example){S.docs={settings:clone(DEFAULT_SETTINGS)};S.example=false}
  afterLoadOnboard()}
function afterLoadOnboard(){
  if(needsOnboarding()){const p=S.docs.profile||{},nm=p.name||activeProf().name;S.onboard={step:0,d:{name:nm==="Me"?"":nm,goal:p.goal||"",activity:p.activity||"",dob:p.dob||"",sex:p.sex||"",height:p.height||"",weight:p.weight||"",habits:[...(settings().habits||[])],targets:null}}}
  else S.onboard=null}
function renderOnboard(){const O=S.onboard,d=O.d,N=6;
  const dots=`<div class="obdots" aria-label="Step ${O.step+1} of ${N}">${[...Array(N)].map((_,i)=>`<i class="${i<=O.step?"on":""}"></i>`).join("")}</div>`;
  const pick=(k,opts)=>`<div class="obpick">${opts.map(([v,l,sub])=>`<button data-act="obPick" data-k="${k}" data-v="${v}" aria-pressed="${String(d[k])===String(v)}"><b>${l}</b>${sub?`<span class="small muted">${sub}</span>`:""}</button>`).join("")}</div>`;
  const nav=(next,canSkip)=>`<div class="row" style="justify-content:space-between;margin-top:6px">${O.step?`<button class="btn" data-act="obBack">Back</button>`:`<button class="btn ghost" data-act="obSkip">Skip setup</button>`}<span class="row" style="gap:4px">${canSkip?`<button class="btn ghost" data-act="obNext" data-skip="1">Skip</button>`:""}<button class="btn primary" data-act="obNext">${next||"Next"}</button></span></div>`;
  let body="";
  if(O.step===0)body=`<h1>Welcome</h1><p class="sub" style="font-size:15px">Let's set up Project Fitness. It takes about a minute, and you can change everything later in Settings.</p>
    <label class="field"><span class="label">What should we call you?</span><input id="ob_name" data-act="ob" data-k="name" value="${esc(d.name)}" placeholder="Your first name" autocomplete="given-name"></label>${nav("Let's go")}`;
  if(O.step===1)body=`<h1>Your goal</h1>${pick("goal",[["lose","Lose fat","Lean out steadily"],["gain","Build muscle","Add size and strength"],["maintain","Maintain","Stay where you are, feel better"],["perform","Performance","Train for a sport or event"]])}
    <div class="label" style="margin-top:8px">How active are you?</div>${pick("activity",ACT.map(([v,l])=>{const [a,b]=l.split(": ");return [v,a,b||""]}))}${nav()}`;
  if(O.step===2)body=`<h1>About you</h1><p class="sub" style="font-size:14px">Used to suggest calories and macros. Stored only on this phone.</p>
    <div class="grid2"><label class="field"><span class="label">Date of birth</span><input id="ob_dob" type="date" data-act="ob" data-k="dob" value="${esc(d.dob)}"></label>
    <label class="field"><span class="label">Sex (for calorie maths)</span><select id="ob_sex" data-act="ob" data-k="sex"><option value="">Choose</option><option value="m" ${d.sex==="m"?"selected":""}>Male</option><option value="f" ${d.sex==="f"?"selected":""}>Female</option></select></label>
    <label class="field"><span class="label">Height (cm)</span><input id="ob_height" type="number" step="any" inputmode="decimal" data-act="ob" data-k="height" value="${esc(d.height)}"></label>
    <label class="field"><span class="label">Weight (kg)</span><input id="ob_weight" type="number" step="any" inputmode="decimal" data-act="ob" data-k="weight" value="${esc(d.weight)}"></label></div>${nav("Next",true)}`;
  if(O.step===3)body=`<h1>Health check</h1>${healthForm(d.health||(d.health={}),"ob")}${nav("Next",true)}`;
  if(O.step===4&&d.minor)body=`<h1>Daily targets</h1><div class="hint"><b>Project Fitness is designed for adults.</b><span class="small">As you're under 18, please use it with a parent or guardian's permission and your coach's guidance. Calorie and macro numbers are switched off. Focus on regular meals, good sleep and enjoying training.</span></div>${nav()}`;
  else if(O.step===4){const sg=suggestFrom(d,d.weight);if(!d.targets)d.targets=sg?{kcal:sg.kcal,protein:sg.protein,carbs:sg.carbs,fat:sg.fat}:{...DEFAULT_TARGETS};const t=d.targets;
    body=`<h1>Daily targets</h1><p class="sub" style="font-size:14px">${sg?`Suggested from your details (maintenance about ${sg.tdee.toLocaleString("en-GB")} kcal). Adjust if your coach gave you numbers.`:"Starting numbers. Add your details later in Settings to get personal suggestions, or type your coach's numbers."}</p>
    <div class="grid2">${MK.map(k=>`<label class="field"><span class="label">${MAC[k].label} (${MAC[k].unit})</span><input id="ob_t_${k}" type="number" step="any" inputmode="numeric" data-act="obT" data-k="${k}" value="${t[k]}"></label>`).join("")}</div><div id="obWarn">${lowKcalWarn(t.kcal,d.sex)}</div>${sg&&sg.capped?`<span class="small muted">Your goal would have gone lower, so this is set at the safe minimum.</span>`:""}${nav()}`}
  if(O.step===5)body=`<h1>Daily habits</h1><p class="sub" style="font-size:14px">Pick a few to tick off each day. Small and repeatable works best.</p>
    <div class="stack" style="gap:2px">${[...new Set([...HABIT_IDEAS,...d.habits])].map(h=>`<label class="habit"><input type="checkbox" data-act="obHabit" data-h="${esc(h)}" ${d.habits.includes(h)?"checked":""}><span>${esc(h)}</span></label>`).join("")}</div>
    <form class="row" id="obHabitForm" style="flex-wrap:nowrap"><input id="ob_newhabit" placeholder="Add your own" autocomplete="off"><button class="btn" type="submit">Add</button></form>${nav("Finish")}`;
  return `<div class="onboard stack">${dots}${body}</div>`}
function finishOnboard(skip){const d=S.onboard.d,name=(d.name||"").trim()||activeProf().name;
  const pr={...(S.docs.profile||{}),type:"profile",name,onboarded:true};
  if(!skip){Object.assign(pr,{goal:d.goal,activity:d.activity,dob:d.dob,sex:d.sex,height:d.height?+d.height:"",weight:d.weight?+d.weight:""});
    if(d.health&&HEALTH_Q.every(([k])=>d.health[k])&&d.health.consent)pr.health=healthRecord(d.health);
    if(d.minor){pr.minor=true;pr.habitsOnly=true}}
  S.onboard=null;save("profile",pr);
  if(!skip){const st=clone(settings());if(d.targets&&!d.minor)st.targets={kcal:+d.targets.kcal||0,protein:+d.targets.protein||0,carbs:+d.targets.carbs||0,fat:+d.targets.fat||0};st.habits=d.habits;save("settings",st);
    if(d.weight){const k=todayKey();save("body_"+k,{type:"body",date:k,weight:+d.weight})}}
  activeProf().name=name;saveProf();S.tab="today";render();window.scrollTo(0,0);toast(skip?"You can finish setup any time in Settings":"All set, "+name.split(" ")[0]+". Let's go 💪")}



/* ---------- health check (based on the general questions of the PAR-Q+) ---------- */
const HEALTH_Q=[
  ["heart","Has a doctor ever said you have a heart condition or high blood pressure?"],
  ["chest","Do you get chest pain at rest, during daily activities, or when you exercise?"],
  ["dizzy","Do you lose balance because of dizziness, or have you lost consciousness in the last 12 months?"],
  ["chronic","Have you been diagnosed with another long-term medical condition (other than heart disease or high blood pressure)?"],
  ["meds","Are you currently taking prescribed medication for a long-term medical condition?"],
  ["joint","Do you have a bone, joint or muscle problem (now or in the last 12 months) that could get worse with more exercise?"],
  ["supervised","Has a doctor ever said you should only exercise under medical supervision?"],
  ["pregnant","Are you pregnant, or have you given birth in the last 6 months?"]];
function healthForm(h,prefix){const yes=HEALTH_Q.filter(([k])=>h[k]==="yes"),done=HEALTH_Q.every(([k])=>h[k]);
  return `<p class="sub" style="font-size:14px;margin:0">A quick safety check before you train. Answer honestly. It's a screening questionnaire, not a medical assessment.</p>
    <div class="stack" style="gap:0">${HEALTH_Q.map(([k,q])=>`<div class="hq"><span class="small">${q}</span><div class="yn" role="group" aria-label="${esc(q)}">${["no","yes"].map(v=>`<button data-act="hq" data-p="${prefix}" data-k="${k}" data-v="${v}" aria-pressed="${h[k]===v}">${v==="yes"?"Yes":"No"}</button>`).join("")}</div></div>`).join("")}</div>
    ${yes.length?`<div class="hint"><b>Please check with your GP before starting or increasing exercise.</b><span class="small">You answered yes to ${yes.length} question${yes.length===1?"":"s"}. Let your coach know too. Stop and get medical help straight away if you have chest pain, faint, or feel severely breathless while exercising.</span></div>`
      :done?`<div class="small good">All clear. If anything changes, update this in Settings → Profile & account.</div>`:""}
    <label class="habit"><input type="checkbox" data-act="hqConsent" data-p="${prefix}" ${h.consent?"checked":""}><span class="small">I agree to these answers being stored in Project Fitness. They're health information, kept on this phone (and my account if I sign in), and only shared with a coach if I choose to.</span></label>`}
const healthRecord=h=>({answers:Object.fromEntries(HEALTH_Q.map(([k])=>[k,h[k]])),date:todayKey(),flagged:HEALTH_Q.some(([k])=>h[k]==="yes"),consent:true});
function healthPanel(){const p=S.docs.profile||{},hr=p.health,draft=S.healthDraft;
  if(draft)return `<section class="panel"><h2>Health check</h2>${healthForm(draft,"set")}<div class="row"><button class="btn primary" data-act="hqSave">Save health check</button><button class="btn" data-act="hqCancel">Cancel</button></div></section>`;
  const old=hr&&hr.date<addDays(todayKey(),-365);
  return `<section class="panel"><h2>Health check</h2>
    <div class="small">${!hr?"Not done yet.":hr.flagged?`<b style="color:var(--protein)">Check with your GP</b> before increasing exercise (done ${fmtDay(hr.date)}).`:`<span class="good"><b>All clear</b></span> (done ${fmtDay(hr.date)}).`}${old?" It's over a year old, so please update it.":""}</div>
    <button class="btn${!hr||old?" primary":""}" style="align-self:flex-start" data-act="hqStart">${hr?"Update health check":"Do the health check"}</button>
    ${hr?`<label class="habit"><input type="checkbox" data-act="shareHealth" ${p.shareHealth?"checked":""}><span class="small">Share my health check and pain log with my coach (in progress reports)</span></label>`:""}</section>`}

/* ---------- training templates ---------- */
function renderTemplates(){const T=ofType("template").sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  return `<section class="panel"><div class="spread"><h2>Templates</h2>${T.length?`<span class="label">${T.length}</span>`:""}</div>
    ${T.length?`<div class="hist">${T.map(t=>`<div class="item spread"><span style="min-width:0"><b>${esc(t.name)}</b><span class="small muted" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${kindName(t.kind)} · ${t.exercises.map(e=>esc(e.name)).join(" · ")}</span></span>
      <span class="row" style="gap:0;flex-wrap:nowrap;flex:none"><button class="btn primary" data-act="tplStart" data-id="${t.id}">Start</button><button class="x" data-act="tplDel" data-id="${t.id}" aria-label="Delete template ${esc(t.name)}">×</button></span></div>`).join("")}</div>`
    :`<p class="small muted" style="margin:0">Save any session as a template (e.g. "Upper A") and start it in one tap next time, with last session's weights filled in.</p>`}</section>`}
function saveTemplate(name,exercises,w){w=w||{};name=String(name||"").trim();if(!name){toast("Give the session a name first, e.g. Upper A");document.getElementById("woName")?.focus();return}
  const ex=exercises.filter(e=>String(e.name||"").trim()).map(e=>({name:e.name.trim(),sets:Math.max(1,e.sets.length),reps:(e.sets.find(x=>x.reps)||{}).reps||"",secs:(e.sets.find(x=>x.secs)||{}).secs||"",mode:exMode(e.name,e.mode)==="time"?"time":undefined}));
  const strip=L=>(L||[]).filter(x=>String(x.name||"").trim()).map(x=>({name:x.name.trim(),detail:x.detail||""}));
  if(!ex.length){toast("Add at least one exercise first");return}
  const old=ofType("template").find(t=>exKey(t.name)===exKey(name)),id=old?old.id:"tpl_"+Date.now(),prev=old?clone(S.docs[id]):null;
  save(id,{type:"template",date:todayKey(),name,kind:w.kind||"gym",warmup:strip(w.warmup),cooldown:strip(w.cooldown),exercises:ex});toast((old?"Updated":"Saved")+" template "+name,{undo:()=>restoreDoc(id,prev)})}
function startTemplate(id){const t=S.docs[id];if(!t)return;
  const kind=t.kind||"gym",cp=L=>(L||[]).map(x=>({name:x.name,detail:x.detail||"",done:false}));
  S.draftWorkout={type:"workout",date:todayKey(),name:t.name,kind,warmup:t.warmup?cp(t.warmup):presetList(WARM_PRESET,kind),cooldown:t.cooldown?cp(t.cooldown):presetList(COOL_PRESET,kind),exercises:t.exercises.map(e=>{const h=exHistory(e.name)[0],last=h?h.sets:[];
    return {name:e.name,mode:e.mode,sets:[...Array(e.sets)].map((_,i)=>{const ls=last[i]||last[last.length-1];return ls?{kg:ls.kg,reps:ls.reps,secs:ls.secs}:{kg:"",reps:e.reps||"",secs:e.secs||""}})}})};
  wpStart();render();window.scrollTo(0,0);toast("Last session's weights filled in. Beat them if you can")}


/* ---------- progress photos: stored only on this phone (IndexedDB), never shared or backed up ---------- */
let phDBp=null;
function phDB(){return phDBp||(phDBp=new Promise((res,rej)=>{const r=indexedDB.open("pf-photos",1);r.onupgradeneeded=()=>{const st=r.result.createObjectStore("photos",{keyPath:"id"});st.createIndex("user","user")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function phTx(mode,fn){return phDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction("photos",mode),st=tx.objectStore("photos"),out=fn(st);tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);tx.onerror=()=>rej(tx.error)}))}
async function phLoad(){const user=PROF.active;try{const rows=await phTx("readonly",st=>st.index("user").getAll(IDBKeyRange.only(user)));
