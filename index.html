<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0E6B66">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head>
<body>
<title>Project Fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, gym-whiteboard numerals, fixed bottom tab bar */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E3E9EC; --fg:#13212B; --muted:#5C6B75; --line:#D3DCE1;
  --accent:#0E6B66; --accent-ink:#FFFFFF;
  --protein:#C2453A; --veg:#3E8A3A; --carb:#B7791F; --fat:#6E4FB0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#172127; --sunk:#202C33; --fg:#E6EDF0; --muted:#93A3AC; --line:#2B3940;
  --accent:#3FB8AE; --accent-ink:#06201E;
  --protein:#EB7B70; --veg:#7CC476; --carb:#E3A94F; --fat:#A98BEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#172127; --sunk:#202C33; --fg:#E6EDF0; --muted:#93A3AC; --line:#2B3940;
  --accent:#3FB8AE; --accent-ink:#06201E;
  --protein:#EB7B70; --veg:#7CC476; --carb:#E3A94F; --fat:#A98BEA; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
h2{font-family:var(--display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.banner{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
/* macros */
.macro{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.macro:first-of-type{border-top:0;padding-top:0}
.macro .left{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar.over i{background:repeating-linear-gradient(45deg,var(--c) 0 6px,transparent 6px 9px)}
.editform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--sunk);border-radius:10px;padding:12px}
.editform .wide{grid-column:1/-1}
.editform .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:380px){.editform{grid-template-columns:1fr 1fr}}
/* portions */
.portion{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.portion:first-of-type{border-top:0;padding-top:0}
.pname{display:flex;align-items:baseline;gap:8px}
.pname b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.pname span{font-size:12.5px;color:var(--muted)}
.count{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.count small{font-size:16px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px;flex-wrap:wrap;grid-column:1}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.full{background:var(--c)}
.dot.half{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.over{background:var(--c);opacity:.45}
.steppers{display:flex;gap:6px;grid-column:2;justify-content:flex-end}
.steppers button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}
.steppers button.add{background:var(--c);border-color:var(--c);color:#fff}
.kcal{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:10px;padding:10px 12px}
.kcal b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
/* settings */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .label{font-size:10.5px}
.good{color:var(--veg)}
.ciq{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ciq:first-of-type{border-top:0;padding-top:0}
.anchors{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.focusnote{border-left:4px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.ctable{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctable th,.ctable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
.ctable thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.ctable th[scope=row],.ctable thead th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
[hidden]{display:none!important}
form.row .btn{white-space:nowrap;flex:none}
.setrow{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.setrow:first-child{border-top:0}
.setrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.chev{font-size:24px;line-height:1;color:var(--muted)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.avatar.big{width:56px;height:56px;font-size:20px;display:flex}
.who-row{display:flex;align-items:center;gap:12px;min-width:0}
.btn.back{padding:4px 0;margin-bottom:8px;display:block}
nav.tabs button{font-size:10.5px;letter-spacing:.04em}
/* quick estimate */
.meal{border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
/* quote */
.quote{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 48px 16px 16px}
.quote .label{color:inherit;opacity:.8}
.quote p{margin:6px 0 0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.18;text-wrap:pretty}
.quote .who{margin-top:8px;font-size:13.5px;font-weight:600;opacity:.85}
.quote{background-size:cover;background-position:center}
.quote.photo{color:#fff}
.qbtns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.quote .qbtns button{position:static}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);background:var(--l);box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .sw{background:var(--d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:var(--d)}}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quote button{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:1px solid currentColor;background:transparent;color:inherit;font-size:17px;line-height:1;opacity:.85}
/* habits */
.habit{display:flex;gap:10px;align-items:center;padding:6px 0}
.habit input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hrow{display:flex;gap:6px;align-items:center}
.hrow input{flex:1;background:var(--surface)}
.hb{flex:none;width:36px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;line-height:1}
.hb:disabled{opacity:.35;cursor:default}
.hb.del{color:var(--protein)}
/* foods */
.food{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.food:first-child{border-top:0}
.food .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.food .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px;color:var(--c);border:1px solid var(--c)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 4px}
.result{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px}
.status{font-size:13px;color:var(--muted);min-height:1em}
/* workouts */
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px 24px;gap:6px;align-items:center}
.set .done{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:18px;font-weight:700;line-height:1}
.set .done[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* rest timer */
.restbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.restbar .t{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:84px}
.restbar .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:600}
.restbar .prog{height:4px;border-radius:99px;background:rgba(127,127,127,.35);overflow:hidden;margin-top:5px}
.restbar .prog i{display:block;height:100%;background:var(--accent)}
.restbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;height:36px;min-width:44px;padding:0 8px;font-weight:600;font-size:13px}
.restbar.over{background:var(--accent);color:var(--accent-ink)}
.restbar.over .prog i{background:var(--accent-ink)}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.hist{display:flex;flex-direction:column}
.hist .item{padding:10px 0;border-top:1px solid var(--line)}
.hist .item:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.lastline{background:var(--sunk);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.lastline button{align-self:flex-start}
.exhead{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.exhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.exdetail{margin-top:8px;display:flex;flex-direction:column;gap:2px}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90vw;display:flex;align-items:center;gap:12px}
.toast[hidden]{display:none}
.toast .undo{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px 2px;font-size:13.5px}
/* meals */
.mealpick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mealpick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600;font-size:12.5px}
.mealpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip .muted{font-weight:500}
.mealgrp{display:flex;flex-direction:column;padding-top:10px;border-top:1px solid var(--line)}
.mealgrp:first-child{border-top:0;padding-top:0}
.mealgrp .food:first-of-type{border-top:0}
.fbtns{display:flex;align-items:center;gap:0;flex:none}
.star{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 6px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--carb)}
@media (prefers-reduced-motion:no-preference){.dot{transition:background .15s}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="restbar" id="restbar" role="timer" aria-live="off" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="lookIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<input type="file" id="reportIn" accept="application/json,.json" hidden>

<script>
(function(){
const MAC = {
  kcal:{label:"Calories",unit:"kcal",c:"var(--accent)"},
  protein:{label:"Protein",unit:"g",c:"var(--protein)"},
  carbs:{label:"Carbs",unit:"g",c:"var(--carb)"},
  fat:{label:"Fat",unit:"g",c:"var(--fat)"}
};
const MK = Object.keys(MAC), GK=["protein","carbs","fat"];
const DEFAULT_TARGETS={kcal:2400,protein:180,carbs:240,fat:80};
const DEFAULT_SETTINGS = {type:"settings",targets:DEFAULT_TARGETS,
  habits:["50 bodyweight reps","2 litres of water","8,000+ steps","7+ hours sleep","Protein at every meal"]};
const macroKcal=t=>Math.round((+t.protein||0)*4+(+t.carbs||0)*4+(+t.fat||0)*9);

const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);const dt=new Date(y,m-1,d+n);return keyOf(dt)};
const fmtDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const half=n=>Math.round(n*2)/2;
const fmtN=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S = {tab:"today",day:todayKey(),docs:{},example:true,db:null,col:null,sample:null,
  results:[],searching:false,searchMsg:"",draftWorkout:null,ciDraft:null,showTargets:false,editFood:null};

/* ---------- example data shown until the first real entry ---------- */
function exampleDocs(){
  const t=todayKey(), docs={settings:DEFAULT_SETTINGS};
  docs["day_"+t]={type:"day",date:t,habits:{"Protein at every meal":true,"2 litres of water":true},
    foods:[{name:"3 scrambled eggs + 1 slice wholemeal toast",kcal:330,protein:22,carbs:16,fat:19},
           {name:"Chicken breast, rice & broccoli",kcal:520,protein:45,carbs:60,fat:9},
           {name:"Greek yoghurt 0% (170g) + berries",kcal:140,protein:17,carbs:15,fat:0}]};
  const w=[83.4,83.1,82.9,83.0,82.6,82.4,82.1];
  w.forEach((kg,i)=>{const k=addDays(t,-(6-i)*7);docs["body_"+k]={type:"body",date:k,weight:kg,waist:i===6?88:(i===0?91:null)}});
  docs["wo_ex1"]={type:"workout",date:addDays(t,-1),name:"Lower A",exercises:[
    {name:"Back squat",sets:[{kg:80,reps:8},{kg:80,reps:8},{kg:80,reps:7}]},
    {name:"Romanian deadlift",sets:[{kg:70,reps:10},{kg:70,reps:10}]}]};
  const ck=addDays(t,-((new Date().getDay()+6)%7));
  docs["ci_"+ck]={type:"checkin",date:ck,adherence:4,energy:4,sleep:3,stress:2,hunger:3,win:"Hit protein every day",struggle:"Late snacking Thursday",focus:"Pre-plan evening snack"};
  return docs;
}
S.docs=exampleDocs();

/* ---------- storage ---------- */
/* ---------- users on this device: each has their own data ---------- */
const PKEY="pf-profiles";
let PROF=(()=>{try{const p=JSON.parse(localStorage.getItem(PKEY)||"null");if(p&&p.list&&p.list.length)return p}catch(e){}
  // first run with users: the existing data becomes the first user's
  const p={list:[{id:"main",name:"Me"}],active:"main"};

function saveLocal(){try{localStorage.setItem(dataKey(),JSON.stringify(S.docs))}catch(e){toast("Couldn't save. This phone's storage may be full.")}}
const timers={};
function save(id,data){
  if(S.example){S.docs={settings:S.docs.settings||DEFAULT_SETTINGS};S.example=false;
    if(S.col){S.col.doc("settings").set(clone(S.docs.settings)).catch(()=>{})}}
  S.docs[id]=data;render();
  if(S.col){clearTimeout(timers[id]);timers[id]=setTimeout(()=>{S.col.doc(id).set(clone(data)).catch(e=>toast("Couldn't save: "+(e&&e.message||"try again"))).finally(()=>{delete timers[id]})},500)}
  else saveLocal();
}
function remove(id){delete S.docs[id];render();if(S.col){S.col.doc(id).delete().catch(()=>toast("Couldn't delete, try again"))}else saveLocal()}

function toast(msg,opt){const t=document.getElementById("toast");t.innerHTML="";const sp=document.createElement("span");sp.textContent=msg;t.appendChild(sp);
  if(opt&&opt.undo){const b=document.createElement("button");b.className="undo";b.type="button";b.textContent="Undo";b.onclick=()=>{t.hidden=true;opt.undo();toast("Undone")};t.appendChild(b)}
  t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,opt&&opt.undo?6000:2600)}

function restoreDoc(id,prev){if(prev)save(id,prev);else remove(id)}

function macroLeft(){const t=totals(dayDoc(S.day)),tg=settings().targets,l=Math.round(tg.kcal-t.kcal),p=Math.round(tg.protein-t.protein);
  return (l>=0?l.toLocaleString("en-GB")+" kcal left":Math.abs(l).toLocaleString("en-GB")+" kcal over")+(p>0?", "+p+"g protein to go":", protein hit")}

const LIB_GROUP={};Object.entries(EX_LIB).forEach(([g,l])=>l.forEach(n=>LIB_GROUP[n.toLowerCase()]=g));
const exKey=n=>String(n||"").trim().toLowerCase();
// every logged instance of an exercise, newest first (example data excluded once real data exists)
function exHistory(name){const k=exKey(name);if(!k)return[];const out=[];
  ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{if(exKey(e.name)===k&&e.sets&&e.sets.length)out.push({date:w.date,session:w.name,sets:e.sets})}));return out}
const e1rm=s=>(+s.kg||0)*(1+(+s.reps||0)/30);
function bestSet(sets){return sets.reduce((b,s)=>!b||e1rm(s)>e1rm(b)?s:b,null)}
const fmtSets=sets=>sets.map(s=>`${fmtN(+s.kg||0)}×${s.reps||0}`).join(", ");
function exOptions(){const mine=new Map();ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{const k=exKey(e.name);if(k&&!LIB_GROUP[k]&&!mine.has(k))mine.set(k,e.name.trim())}));
  return [...mine.values()].map(n=>`<option value="${esc(n)}" label="Your exercise">`).join("")+Object.entries(EX_LIB).map(([g,l])=>l.map(n=>`<option value="${esc(n)}" label="${esc(g)}">`).join("")).join("")}
function lastLine(name,ei){if(!exKey(name))return"";const h=exHistory(name);
  if(!h.length)return `<div class="lastline small muted">First time logging this. Today sets your baseline.</div>`;
  const l=h[0],b=bestSet(h.flatMap(x=>x.sets));
  return `<div class="lastline small"><div><span class="muted">Last time (${fmtDay(l.date)}):</span> ${fmtSets(l.sets)}</div>
    <div class="muted">Best: ${fmtN(+b.kg||0)} kg × ${b.reps} · est. 1RM ${fmtN(Math.round(e1rm(b)*2)/2)} kg</div>
    <button class="btn ghost" style="padding:4px 0" data-act="useLast" data-ei="${ei}">Copy last time's sets</button></div>`}
function exSpark(h){const pts=h.slice(0,10).reverse().map(x=>e1rm(bestSet(x.sets)));if(pts.length<2)return"";
  const W=120,H=32,lo=Math.min(...pts),hi=Math.max(...pts),r=hi-lo||1;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map((v,i)=>`${(i*(W-4)/(pts.length-1)+2).toFixed(1)},${(H-3-(v-lo)/r*(H-6)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>`}
function renderExercises(){
  const map=new Map();ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{const k=exKey(e.name);if(k&&!map.has(k))map.set(k,e.name.trim())}));
  if(!map.size)return"";
  const q=exKey(S.exFilter);
  const rows=[...map.entries()].filter(([k])=>!q||k.includes(q)).map(([k,name])=>{const h=exHistory(name),b=bestSet(h.flatMap(x=>x.sets)),open=S.openEx===k;
    return `<div class="item"><button class="exhead" data-act="openEx" data-k="${esc(k)}" aria-expanded="${open}">
      <span style="min-width:0"><b>${esc(name)}</b><span class="small muted" style="display:block">${LIB_GROUP[k]||"Your exercise"} · ${h.length} session${h.length===1?"":"s"} · last ${fmtDay(h[0].date)}</span></span>
      <span class="small" style="text-align:right;font-variant-numeric:tabular-nums;flex:none">${fmtN(+b.kg||0)} kg × ${b.reps}<span class="muted" style="display:block">est. 1RM ${fmtN(Math.round(e1rm(b)*2)/2)}</span></span></button>
      ${open?`<div class="exdetail">${exSpark(h)?`<div class="small muted">Est. 1RM trend</div>${exSpark(h)}`:""}
        ${h.map(x=>`<div class="spread small" style="padding:4px 0;border-top:1px solid var(--line)"><span class="muted">${fmtDay(x.date)}${x.session?" · "+esc(x.session):""}</span><span style="font-variant-numeric:tabular-nums;text-align:right">${fmtSets(x.sets)}</span></div>`).join("")}</div>`:""}</div>`}).join("");
  return `<section class="panel"><div class="spread"><h2>Exercise history</h2><span class="label">${map.size} exercise${map.size===1?"":"s"}</span></div>
    ${map.size>5?`<input id="exFilter" data-act="exFilter" placeholder="Find an exercise" value="${esc(S.exFilter||"")}" autocomplete="off">`:""}
    <div class="hist">${rows||'<p class="muted small" style="margin:0">No match.</p>'}</div></section>`}

function weightChart(list){
  const pts=list.filter(b=>b.weight).slice(0,12).reverse(); if(pts.length<2)return `<p class="muted small" style="margin:0">Log at least two weigh-ins to see your trend.</p>`;
  const W=320,H=140,L=34,R=10,T=12,B=22,ws=pts.map(p=>+p.weight);let lo=Math.floor(Math.min(...ws)-.5),hi=Math.ceil(Math.max(...ws)+.5);
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(+p.weight).toFixed(1)}`).join(" ");
  const area=`${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(v)}</text>`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight trend">${ticks}
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(+last.weight)}" r="4" fill="var(--accent)"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtDay(pts[0].date)}</text><text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtDay(last.date)}</text></svg>`;
}

    <div class="spread"><span class="small muted">${M.slice(1).filter(([k])=>b[k]).map(([k,l])=>l.replace(" (cm)","")+" "+b[k]+" cm").join(" · ")||"&nbsp;"}</span><button class="x" data-act="delBody" data-id="${b.id}" aria-label="Delete entry">×</button></div></div>`).join("")||'<p class="muted small" style="margin:0">No entries yet.</p>'}</div></section></div>`;

const CQ=[
  ["adherence","Sticking to the plan","How closely did you follow your training and nutrition plan?","Barely","Nailed it"],
  ["motivation","Motivation","How driven did you feel to train and eat well?","Running on empty","Fired up"],
  ["energy","Energy","How were your energy levels day to day?","Drained","Full of energy"],
  ["sleep","Sleep","How well did you sleep?","Poorly","Really well"],
  ["stress","Stress","How stressed did you feel?","Calm","Very stressed"],
  ["hunger","Appetite & cravings","How hard were hunger and cravings to manage?","Easy","Very hard"]];
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function glanceTile(label,val,sub,tone){return `<div class="tile"><span class="label">${label}</span><b>${val}</b>${sub?`<span class="small ${tone||"muted"}">${sub}</span>`:""}</div>`}
function weekGlance(ws){const tw=weekSummary(ws,false),lw=weekSummary(addDays(ws,-7),false),tg=settings().targets;
  const wd=tw.weight!=null&&lw.weight!=null?r1(tw.weight-lw.weight):null;
  const tiles=[
    glanceTile("Weight kg",tw.weight!=null?fmtN(tw.weight):"—",wd!=null?(wd>0?"+":"")+fmtN(wd)+" kg vs last week":tw.weight!=null?"first weigh-in week":"log a weigh-in"),
    glanceTile("Avg calories",tw.kcal!=null?tw.kcal.toLocaleString("en-GB"):"—",tw.kcal!=null?"target "+Number(tg.kcal).toLocaleString("en-GB"):"no food logged"),
    glanceTile("Avg protein",tw.protein!=null?tw.protein+"g":"—",tw.protein!=null?(tw.protein>=tg.protein*.9?"on target":"target "+tg.protein+"g"):"",tw.protein!=null&&tw.protein>=tg.protein*.9?"good":"muted"),
    glanceTile("Days on target",tw.daysLogged?`${tw.onTarget||0}/${tw.daysLogged}`:"—",tw.daysLogged?`${tw.daysLogged} day${tw.daysLogged===1?"":"s"} logged`:""),
    glanceTile("Habits",tw.habitsPct!=null?tw.habitsPct+"%":"—","of daily ticks"),
    glanceTile("Sessions",tw.sessions,tw.volume?tw.volume.toLocaleString("en-GB")+" kg volume":"training")];
  return `<section class="panel"><div class="spread"><h2>Your week so far</h2><span class="label">auto</span></div><div class="tiles">${tiles.join("")}</div></section>`}
function renderCheckin(){
  const coach=!!(S.docs.profile&&S.docs.profile.coach);
  if(coach&&S.ciView==="clients")return renderClients();
  const list=ofType("checkin"),ws=weekStart();
  if(!S.ciDraft){const ex=S.docs["ci_"+ws];S.ciDraft=ex&&!S.example?clone(ex):{type:"checkin",date:ws}}
  const c=S.ciDraft,prev=S.docs["ci_"+addDays(ws,-7)],done=CQ.filter(([k])=>c[k]).length;
  return `${exampleBanner()}<header class="top"><div><h1>Check-in</h1><div class="sub">Week of ${fmtDay(ws)}</div></div></header>
  ${coach?coachSeg():""}

      <div class="scale" role="group" aria-label="${l}">${[1,2,3,4,5].map(n=>`<button data-act="ciScale" data-k="${k}" data-n="${n}" aria-pressed="${c[k]===n}">${n}</button>`).join("")}</div>

  <section class="panel"><h2>Reflect</h2>

    <label class="field"><span class="label">What got in the way?</span><textarea id="ci_struggle" data-act="ciText" data-k="struggle" placeholder="e.g. Late finishes at work, skipped Thursday">${esc(c.struggle)}</textarea></label>

    <div class="small muted" style="font-variant-numeric:tabular-nums">${CQ.filter(([k])=>x[k]).map(([k,l])=>l.split(" ")[0]+" "+x[k]+"/5").join(" · ")}</div>
    ${x.win?`<div class="small"><b>Win:</b> ${esc(x.win)}</div>`:""}${x.struggle?`<div class="small"><b>Struggle:</b> ${esc(x.struggle)}</div>`:""}${x.focus?`<div class="small"><b>Focus:</b> ${esc(x.focus)}</div>`:""}</div>`).join("")||'<p class="muted small" style="margin:0">No check-ins yet.</p>'}</div></section></div>`;
}

function render(){
  const tb=document.getElementById("tabs");
  if(S.lock){tb.hidden=true;document.getElementById("app").innerHTML=renderLock();return}
  tb.hidden=false;
  renderTabs();
  const app=document.getElementById("app");
  const fe=document.activeElement, fid=fe&&fe.id, sel=fe&&fe.selectionStart;
  const qv=document.getElementById("q")?.value;
  // keep anything typed into an open food form when the page redraws (e.g. a search finishing)
  const ff=document.querySelector('form[data-form="food"]'),keep=ff?{i:ff.dataset.i,v:[...ff.querySelectorAll("input")].map(x=>[x.id,x.value])}:null;
  app.innerHTML=S.tab==="today"?renderToday():S.tab==="train"?renderTrain():S.tab==="body"?renderBody():S.tab==="checkin"?renderCheckin():renderSettings();
  if(qv&&document.getElementById("q"))document.getElementById("q").value=qv;
  if(keep){const nf=document.querySelector(`form[data-form="food"][data-i="${keep.i}"]`);if(nf)keep.v.forEach(([id,v])=>{const el=id&&document.getElementById(id);if(el)el.value=v})}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}

function chartSVG(weeks,series,o={}){const W=320,H=150,L=36,R=8,T=10,B=22,n=weeks.length;
  const vals=series.flatMap(sr=>weeks.map(w=>w[sr.key]).filter(v=>v!=null&&v!==""));
  if(!vals.length)return `<p class="small muted" style="margin:0">Nothing logged for this yet.</p>`;
  let lo=o.min??Math.min(...vals,o.target??Infinity),hi=o.max??Math.max(...vals,o.target??-Infinity);
  if(o.min==null){const pad=(hi-lo)*0.15||1;lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);if(o.zero)lo=0}
  const x=i=>n<2?(L+W-R)/2:L+i*(W-L-R)/(n-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo||1),bw=Math.max(4,Math.min(22,(W-L-R)/n*0.6));
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-5}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${fmtN(Math.round(v*10)/10)}</text>`).join("");
  const marks=series.map(sr=>{if(sr.bars)return weeks.map((w,i)=>w[sr.key]==null?"":`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${y(w[sr.key]).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,y(lo)-y(w[sr.key])).toFixed(1)}" rx="2" fill="${sr.color}"><title>${fmtDay(w.week)}: ${w[sr.key]}</title></rect>`).join("");
    let d="",pen=false,dots="";weeks.forEach((w,i)=>{const v=w[sr.key];if(v==null||v==="")return;d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);pen=true;dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" fill="${sr.color}"><title>${fmtDay(w.week)}: ${v}</title></circle>`});
    return `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`}).join("");
  const tgt=o.target!=null?`<line x1="${L}" x2="${W-R}" y1="${y(o.target).toFixed(1)}" y2="${y(o.target).toFixed(1)}" stroke="var(--fg)" stroke-dasharray="4 3" opacity=".6"/><text x="${W-R}" y="${(y(o.target)-4).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">target ${fmtN(o.target)}</text>`:"";
  const xl=n?`<text x="${x(0)}" y="${H-6}" font-size="9.5" fill="var(--muted)" ${n<2?'text-anchor="middle"':""}>${fmtDay(weeks[0].week)}</text>${n>1?`<text x="${x(n-1)}" y="${H-6}" font-size="9.5" fill="var(--muted)" text-anchor="end">${fmtDay(weeks[n-1].week)}</text>`:""}`:"";
  const legend=series.length>1?`<div class="legend">${series.map(sr=>`<span><i style="background:${sr.color}"></i>${sr.label}</span>`).join("")}</div>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||series.map(s=>s.label).join(", "))}">${grid}${tgt}${marks}${xl}</svg>${legend}`}

        <span class="small" style="text-align:right;font-variant-numeric:tabular-nums;flex:none">${w.length?fmtN(w[w.length-1].weight)+" kg":"—"}${ch!=null?`<span class="muted" style="display:block">${ch>0?"+":""}${fmtN(ch)} kg</span>`:""}</span></button>`}).join("")}</section>`
    :`<section class="panel"><h2>No clients yet</h2><p class="small" style="margin:0">Ask your client to open <b>Check-in</b> in their own app and tap <b>Create and send report</b>. When they send you the file, tap <b>Import report</b> above and choose it.</p></section>`}
    <section class="panel"><h2>How this protects your clients</h2><p class="small" style="margin:0">You only see what each client chooses to send: weekly summaries, never individual meals or their account. Reports are stored in your app on this phone only. Delete a client here when you stop working together.</p></section></div>`}
function clientDetail(id,c){const wk=c.weeks,t=c.targets||{},hasNotes=wk.some(w=>w.win||w.struggle||w.focus);
  const fv=(w,col)=>col[2]?col[2](w):(w[col[0]]==null||w[col[0]]===""?"—":col[0]==="volume"?Number(w[col[0]]).toLocaleString("en-GB"):fmtN(+w[col[0]]));
  return `<div class="stack"><section class="panel"><div class="spread"><button class="btn ghost" style="padding:4px 0" data-act="openClient" data-id="">‹ All clients</button><button class="btn ghost" style="color:var(--protein)" data-act="delClient" data-id="${id}">${S.confirmDelClient===id?"Tap to confirm":"Remove"}</button></div>
    <div class="who-row"><span class="avatar big">${esc(initials(c.name))}</span><div><b style="font-size:18px">${esc(c.name)}</b><div class="small muted">${esc(GOALS[c.goal]||"No goal set")} · targets ${t.kcal?Number(t.kcal).toLocaleString("en-GB")+" kcal, "+t.protein+"g protein":"not shared"}<br>${wk.length} weeks · last report ${fmtDay(String(c.received||c.date).slice(0,10))}</div></div></div></section>
  <section class="panel"><h2>Bodyweight</h2>${chartSVG(wk,[{key:"weight",label:"Weight (kg)",color:"var(--accent)"}],{label:"Weekly average bodyweight"})}</section>

  <section class="panel"><h2>Calories</h2>${chartSVG(wk,[{key:"kcal",label:"Avg kcal",color:"var(--carb)",bars:true}],{target:t.kcal,zero:true,label:"Average daily calories per week"})}</section>
  <section class="panel"><h2>Protein</h2>${chartSVG(wk,[{key:"protein",label:"Avg protein (g)",color:"var(--protein)",bars:true}],{target:t.protein,zero:true,label:"Average daily protein per week"})}</section>
  <section class="panel"><h2>Training</h2>${chartSVG(wk,[{key:"sessions",label:"Sessions",color:"var(--veg)",bars:true}],{zero:true,label:"Sessions per week"})}</section>
  <section class="panel"><h2>Check-in scores</h2>${chartSVG(wk,[{key:"adherence",label:"Adherence",color:"var(--accent)"},{key:"motivation",label:"Motivation",color:"var(--veg)"},{key:"energy",label:"Energy",color:"var(--carb)"},{key:"sleep",label:"Sleep",color:"var(--fat)"},{key:"stress",label:"Stress",color:"var(--protein)"}],{min:1,max:5,label:"Weekly check-in scores out of 5"})}</section>
  <section class="panel"><div class="spread"><h2>Weekly table</h2><button class="btn ghost" data-act="clientCsv" data-id="${id}">Download CSV</button></div>
    <div class="tablewrap"><table class="ctable"><thead><tr>${CLIENT_COLS.map(col=>`<th scope="col">${col[1]}</th>`).join("")}</tr></thead>
    <tbody>${wk.slice().reverse().map(w=>`<tr>${CLIENT_COLS.map((col,i)=>i?`<td>${fv(w,col)}</td>`:`<th scope="row">${fv(w,col)}</th>`).join("")}</tr>`).join("")}</tbody></table></div></section>
  ${hasNotes?`<section class="panel"><h2>Their check-in notes</h2><div class="hist">${wk.slice().reverse().filter(w=>w.win||w.struggle||w.focus).map(w=>`<div class="item"><b class="small">${fmtDay(w.week)}</b>
    ${w.win?`<div class="small"><b>Win:</b> ${esc(w.win)}</div>`:""}${w.struggle?`<div class="small"><b>Struggle:</b> ${esc(w.struggle)}</div>`:""}${w.focus?`<div class="small"><b>Focus:</b> ${esc(w.focus)}</div>`:""}</div>`).join("")}</div></section>`:""}
  <section class="panel"><h2>Your consultation notes</h2><textarea id="cnotes" data-act="clientNotes" data-id="${id}" rows="5" placeholder="Private to you, e.g. agreed changes, next review date">${esc(c.notes)}</textarea><span class="small muted">Saved automatically. Never sent to the client.</span></section></div>`}
function clientCsv(id){const c=S.docs[id];if(!c)return;const cols=[...CLIENT_COLS.slice(1).map(x=>[x[0],x[1]]),["hips","Hips cm"],["chest","Chest cm"],["arm","Arm cm"],["thigh","Thigh cm"],["sets","Sets"],["win","Win"],["struggle","Struggle"],["focus","Focus"]];
  const q=v=>v==null?"":/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
  const csv=[["Week starting",...cols.map(x=>x[1])].join(","),...c.weeks.map(w=>[w.week,...cols.map(x=>q(w[x[0]]))].join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${String(c.name).replace(/[^a-z0-9]+/gi,"-").toLowerCase()}-progress.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

const SET_PAGES=[["profile","Profile & account","Name, contact details, body stats and goal"],["users","Users","Add friends or clients, each with their own data"],["targets","Targets & habits","Calories, macros and daily habits"],["rest","Rest timer","Rest length, sound, vibration and notifications"],["look","Appearance","App colour, quote backdrop, light or dark"],["data","Data & backup","Save a backup or move data to a new phone"],["about","About","How your data is stored"]];
const GOALS={lose:"Lose fat",maintain:"Maintain",gain:"Build muscle",perform:"Performance"};
const ACT=[["1.2","Mostly sitting, little exercise"],["1.375","Light: 1–3 sessions a week"],["1.55","Moderate: 3–5 sessions a week"],["1.725","Very active: 6–7 sessions or a physical job"]];
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
const latestWeight=()=>{if(S.example)return null;const b=ofType("body").find(x=>x.weight);return b?+b.weight:null};
function ageFrom(dob){if(!dob)return null;const d=new Date(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>0&&a<110?a:null}
function suggestTargets(){const p=S.docs.profile||{},w=+(latestWeight()||p.weight),h=+p.height,a=ageFrom(p.dob);
  if(!w||!h||!a||!p.sex||!p.activity)return null;
  const tdee=(10*w+6.25*h-5*a+(p.sex==="m"?5:-161))*(+p.activity),adj={lose:0.8,maintain:1,gain:1.1,perform:1.05}[p.goal]||1;
  const kcal=Math.round(tdee*adj/10)*10,protein=Math.round(w*(p.goal==="lose"?2.2:2)),fat=Math.round(kcal*0.25/9),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,carbs,fat,tdee:Math.round(tdee)}}

  const title=(SET_PAGES.find(x=>x[0]===pg)||[0,""])[1];

/* ---------- food search outside Claude: Open Food Facts (free UK food database) ---------- */
const OFF="https://uk.openfoodfacts.org";
function offItem(p){const n=p.nutriments||{},name=[p.product_name||p.generic_name,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" · ");if(!name)return null;
  const per=n["energy-kcal_serving"]!=null&&p.serving_size?"_serving":"_100g",g=k=>+(n[k+per]||0);
  let kcal=g("energy-kcal");if(!kcal&&n["energy"+per])kcal=n["energy"+per]/4.184;
  if(!kcal&&!g("proteins")&&!g("carbohydrates"))return null;
  return {name,serving:per==="_serving"?p.serving_size:"per 100g",kcal:Math.round(kcal),protein_g:g("proteins"),carbs_g:g("carbohydrates"),fat_g:g("fat")}}
async function offSearch(q){
  const code=q.replace(/\s/g,"");
  if(/^\d{8,14}$/.test(code)){const r=await fetch(`${OFF}/api/v2/product/${code}.json?fields=product_name,generic_name,brands,serving_size,nutriments`);const j=await r.json();const it=j&&j.product&&offItem(j.product);return it?[it]:[]}
  const r=await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=product_name,generic_name,brands,serving_size,nutriments`);
  const j=await r.json();return (j.products||[]).map(offItem).filter(Boolean).slice(0,6)}
async function readBarcode(img){if(!("BarcodeDetector" in window))return null;try{const bd=new BarcodeDetector();const bmp=await createImageBitmap(img);const c=await bd.detect(bmp);return c[0]&&c[0].rawValue||null}catch(e){return null}}
async function runOffSearch(q,img){
  S.searching=true;S.results=[];S.searchMsg=img?"Reading the barcode…":"Searching…";render();
  try{
    if(img){const code=await readBarcode(img);if(!code){S.searchMsg="Couldn't read a barcode from that photo. Type the numbers under the barcode into search instead.";S.searching=false;render();return}q=code}
    S.results=await offSearch(q);
    S.searchMsg=S.results.length?(S.meal?"Branded products from Open Food Facts:":"From Open Food Facts. Tap Add, then Edit to change the amount."):S.meal?"":"No match. Try a brand name (e.g. 'Warburtons crumpets'), the barcode number, or add it manually.";
  }catch(e){S.searchMsg="Search didn't work. Check your connection and try again, or add it manually."}
  S.searching=false;render();
}
async function runSearch(q,img){
  const sample=await getSample();
  if(!sample){return runOffSearch(q,img)}
  S.searching=true;S.results=[];S.searchMsg=img?"Reading your photo…":"Searching…";render();
  try{
    const input=img?FOOD_PROMPT+"\n\nThe attached photo shows a product barcode, nutrition label, packaging or a plate of food. Identify the product or meal and estimate one typical serving."+(q?" Extra note: "+q:""):FOOD_PROMPT+"\n\nFood: "+q;
    const res=await sample.json(input,img?{images:[img],modelTier:"default"}:{modelTier:"quick"});
    S.results=(res&&res.items)||[];S.searchMsg=S.results.length?"Estimates. Tap Add to log one.":"No match found. Try describing it differently.";
  }catch(e){S.searchMsg=e&&e.code==="not_granted"?"Allow Claude access for this page to use food search.":e&&e.code==="rate_limited"?"Too many searches just now. Wait a minute and try again.":"Search didn't work. Try again."}
  S.searching=false;render();
}

document.getElementById("lookIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)loadPhoto(f)});
document.getElementById("reportIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importReport(f)});
document.getElementById("importIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importData(f)});
applyLook();
if(activeProf().pin)S.lock={id:PROF.active,boot:true};
if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
(async function connect(){
  if(!window.claude||!window.claude.use){loadLocal();render();return}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){loadLocal();render();return}
    const uid=await user.id();
    S.db=db;S.uid=uid;subscribe();
  }catch(e){loadLocal();render()}
})();
function subscribe(){if(typeof S.unsub==="function")S.unsub();
    S.col=S.db.collection("data/users/"+S.uid+(PROF.active==="main"?"":"_"+PROF.active));
    S.unsub=S.col.onSnapshot(snap=>{
      if(snap.empty){if(!S.example){S.docs={settings:DEFAULT_SETTINGS}}render();return}
      const docs={};snap.docs.forEach(x=>{docs[x.id]=x.data()});Object.keys(timers).forEach(id=>{if(S.docs[id])docs[id]=S.docs[id]});S.docs=docs;S.example=false;render();
    },()=>{toast("Couldn't load your saved data")});
}
})();
</script>
