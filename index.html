<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0E6B66">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fitness"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head>
<body>
<title>Project Fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, gym-whiteboard numerals, fixed bottom tab bar */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E3E9EC; --fg:#13212B; --muted:#5C6B75; --line:#D3DCE1;
  --accent:#0E6B66; --accent-ink:#FFFFFF;
  --protein:#C2453A; --veg:#3E8A3A; --carb:#B7791F; --fat:#6E4FB0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#172127; --sunk:#202C33; --fg:#E6EDF0; --muted:#93A3AC; --line:#2B3940;
  --accent:#3FB8AE; --accent-ink:#06201E;
  --protein:#EB7B70; --veg:#7CC476; --carb:#E3A94F; --fat:#A98BEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#172127; --sunk:#202C33; --fg:#E6EDF0; --muted:#93A3AC; --line:#2B3940;
  --accent:#3FB8AE; --accent-ink:#06201E;
  --protein:#EB7B70; --veg:#7CC476; --carb:#E3A94F; --fat:#A98BEA; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
h2{font-family:var(--display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.banner{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
/* macros */
.macro{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.macro:first-of-type{border-top:0;padding-top:0}
.macro .left{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar.over i{background:repeating-linear-gradient(45deg,var(--c) 0 6px,transparent 6px 9px)}
.editform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--sunk);border-radius:10px;padding:12px}
.editform .wide{grid-column:1/-1}
.editform .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:380px){.editform{grid-template-columns:1fr 1fr}}
/* portions */
.portion{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.portion:first-of-type{border-top:0;padding-top:0}
.pname{display:flex;align-items:baseline;gap:8px}
.pname b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.pname span{font-size:12.5px;color:var(--muted)}
.count{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.count small{font-size:16px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px;flex-wrap:wrap;grid-column:1}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.full{background:var(--c)}
.dot.half{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.over{background:var(--c);opacity:.45}
.steppers{display:flex;gap:6px;grid-column:2;justify-content:flex-end}
.steppers button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}
.steppers button.add{background:var(--c);border-color:var(--c);color:#fff}
.kcal{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:10px;padding:10px 12px}
.kcal b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
/* settings */
.hq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.hq:first-child{border-top:0}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:none;width:112px}
.yn button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600;font-size:13px}
.yn button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hint{border:1px solid var(--carb);background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:.18em;text-align:center;background:var(--sunk);border-radius:12px;padding:10px}
.phgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.phthumb{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.phthumb img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;background:var(--sunk)}
.phthumb span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phthumb:focus-visible img{outline:2px solid var(--accent);outline-offset:2px}
.viewer{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.vbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.vimgs{flex:1;min-height:0;display:grid;gap:6px}.vimgs.two{grid-template-columns:1fr 1fr}
.vimgs figure{margin:0;min-height:0;display:flex;flex-direction:column;gap:4px}
.vimgs img{flex:1;min-height:0;width:100%;object-fit:contain}
.vimgs figcaption{font-size:12px;text-align:center;opacity:.8}
.onboard{max-width:480px;margin:4vh auto 0;padding-bottom:40px}
.onboard h1{font-size:38px}
.obdots{display:flex;gap:6px}.obdots i{flex:1;height:4px;border-radius:99px;background:var(--line)}.obdots i.on{background:var(--accent)}
.obpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.obpick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:64px}
.obpick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:24px;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .label{font-size:10.5px}
.good{color:var(--veg)}
.ciq{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ciq:first-of-type{border-top:0;padding-top:0}
.anchors{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.focusnote{border-left:4px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
.ctable{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctable th,.ctable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
.ctable thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.ctable th[scope=row],.ctable thead th:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
[hidden]{display:none!important}
form.row .btn{white-space:nowrap;flex:none}
.setrow{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.setrow:first-child{border-top:0}
.setrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.chev{font-size:24px;line-height:1;color:var(--muted)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.avatar.big{width:56px;height:56px;font-size:20px;display:flex}
.who-row{display:flex;align-items:center;gap:12px;min-width:0}
.btn.back{padding:4px 0;margin-bottom:8px;display:block}
nav.tabs button{font-size:10.5px;letter-spacing:.04em}
/* quick estimate */
.meal{border:1px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}
/* quote */
.quote{position:relative;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px 48px 16px 16px}
.quote .label{color:inherit;opacity:.8}
.quote p{margin:6px 0 0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.18;text-wrap:pretty}
.quote .who{margin-top:8px;font-size:13.5px;font-weight:600;opacity:.85}
.quote{background-size:cover;background-position:center}
.quote.photo{color:#fff}
.qbtns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.quote .qbtns button{position:static}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);background:var(--l);box-shadow:0 0 0 1px var(--line)}
:root[data-theme="dark"] .sw{background:var(--d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw{background:var(--d)}}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quote button{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:9px;border:1px solid currentColor;background:transparent;color:inherit;font-size:17px;line-height:1;opacity:.85}
/* habits */
.habit{display:flex;gap:10px;align-items:center;padding:6px 0}
.habit input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hrow{display:flex;gap:6px;align-items:center}
.hrow input{flex:1;background:var(--surface)}
.hb{flex:none;width:36px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;line-height:1}
.hb:disabled{opacity:.35;cursor:default}
.hb.del{color:var(--protein)}
/* foods */
.food{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.food:first-child{border-top:0}
.food .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.food .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px;color:var(--c);border:1px solid var(--c)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 4px}
.result{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px}
.status{font-size:13px;color:var(--muted);min-height:1em}
/* workouts */
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 44px 24px;gap:6px;align-items:center}
.set .done{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:18px;font-weight:700;line-height:1}
.set .done[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* rest timer */
.restbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;z-index:6;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.restbar .t{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:84px}
.restbar .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;font-weight:600}
.restbar .prog{height:4px;border-radius:99px;background:rgba(127,127,127,.35);overflow:hidden;margin-top:5px}
.restbar .prog i{display:block;height:100%;background:var(--accent)}
.restbar button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:9px;height:36px;min-width:44px;padding:0 8px;font-weight:600;font-size:13px}
.restbar.over{background:var(--accent);color:var(--accent-ink)}
.restbar.over .prog i{background:var(--accent-ink)}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.hist{display:flex;flex-direction:column}
.hist .item{padding:10px 0;border-top:1px solid var(--line)}
.hist .item:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.lastline{background:var(--sunk);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.lastline button{align-self:flex-start}
.exhead{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.exhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.exdetail{margin-top:8px;display:flex;flex-direction:column;gap:2px}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90vw;display:flex;align-items:center;gap:12px}
.toast[hidden]{display:none}
.toast .undo{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px 2px;font-size:13.5px}
/* meals */
.mealpick{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mealpick button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 0;font-weight:600;font-size:12.5px}
.mealpick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.qchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qchip .muted{font-weight:500}
.mealgrp{display:flex;flex-direction:column;padding-top:10px;border-top:1px solid var(--line)}
.mealgrp:first-child{border-top:0;padding-top:0}
.mealgrp .food:first-of-type{border-top:0}
.fbtns{display:flex;align-items:center;gap:0;flex:none}
.star{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 6px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--carb)}
@media (prefers-reduced-motion:no-preference){.dot{transition:background .15s}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="restbar" id="restbar" role="timer" aria-live="off" hidden></div>
<div id="viewerRoot"></div>
<input type="file" id="phIn" accept="image/*" hidden>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="lookIn" accept="image/*" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>
<input type="file" id="reportIn" accept="application/json,.json" hidden>

<script>
(function(){
const MAC = {
  kcal:{label:"Calories",unit:"kcal",c:"var(--accent)"},
  protein:{label:"Protein",unit:"g",c:"var(--protein)"},
  carbs:{label:"Carbs",unit:"g",c:"var(--carb)"},
  fat:{label:"Fat",unit:"g",c:"var(--fat)"}
};
const MK = Object.keys(MAC), GK=["protein","carbs","fat"];
const DEFAULT_TARGETS={kcal:2400,protein:180,carbs:240,fat:80};
const DEFAULT_SETTINGS = {type:"settings",targets:DEFAULT_TARGETS,
  habits:["50 bodyweight reps","2 litres of water","8,000+ steps","7+ hours sleep","Protein at every meal"]};
const macroKcal=t=>Math.round((+t.protein||0)*4+(+t.carbs||0)*4+(+t.fat||0)*9);

const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);const dt=new Date(y,m-1,d+n);return keyOf(dt)};
const fmtDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const half=n=>Math.round(n*2)/2;
const fmtN=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S = {tab:"today",day:todayKey(),docs:{},example:true,db:null,col:null,sample:null,
  results:[],searching:false,searchMsg:"",draftWorkout:null,ciDraft:null,showTargets:false,editFood:null};

/* ---------- example data shown until the first real entry ---------- */
function exampleDocs(){
  const t=todayKey(), docs={settings:DEFAULT_SETTINGS};
  docs["day_"+t]={type:"day",date:t,habits:{"Protein at every meal":true,"2 litres of water":true},
    foods:[{name:"3 scrambled eggs + 1 slice wholemeal toast",kcal:330,protein:22,carbs:16,fat:19},
           {name:"Chicken breast, rice & broccoli",kcal:520,protein:45,carbs:60,fat:9},
           {name:"Greek yoghurt 0% (170g) + berries",kcal:140,protein:17,carbs:15,fat:0}]};
  const w=[83.4,83.1,82.9,83.0,82.6,82.4,82.1];
  w.forEach((kg,i)=>{const k=addDays(t,-(6-i)*7);docs["body_"+k]={type:"body",date:k,weight:kg,waist:i===6?88:(i===0?91:null)}});
  docs["wo_ex1"]={type:"workout",date:addDays(t,-1),name:"Lower A",exercises:[
    {name:"Back squat",sets:[{kg:80,reps:8},{kg:80,reps:8},{kg:80,reps:7}]},
    {name:"Romanian deadlift",sets:[{kg:70,reps:10},{kg:70,reps:10}]}]};
  const ck=addDays(t,-((new Date().getDay()+6)%7));
  docs["ci_"+ck]={type:"checkin",date:ck,adherence:4,energy:4,sleep:3,stress:2,hunger:3,win:"Hit protein every day",struggle:"Late snacking Thursday",focus:"Pre-plan evening snack"};
  return docs;
}
S.docs=exampleDocs();

/* ---------- storage ---------- */
/* ---------- users on this device: each has their own data ---------- */
const PKEY="pf-profiles";
let PROF=(()=>{try{const p=JSON.parse(localStorage.getItem(PKEY)||"null");if(p&&p.list&&p.list.length)return p}catch(e){}
  // first run with users: the existing data becomes the first user's
  const p={list:[{id:"main",name:"Me"}],active:"main"};
  try{const old=localStorage.getItem("hpc-docs");if(old&&!localStorage.getItem("hpc-docs:main"))localStorage.setItem("hpc-docs:main",old);
    const ol=localStorage.getItem("pf-look");if(ol&&!localStorage.getItem("pf-look:main"))localStorage.setItem("pf-look:main",ol);
    localStorage.setItem(PKEY,JSON.stringify(p))}catch(e){}
  return p})();
const saveProf=()=>{try{localStorage.setItem(PKEY,JSON.stringify(PROF))}catch(e){}};
const activeProf=()=>PROF.list.find(x=>x.id===PROF.active)||PROF.list[0];
const dataKey=id=>"hpc-docs:"+(id||PROF.active);
function loadLocal(){try{const r=localStorage.getItem(dataKey());if(r){const d=JSON.parse(r);if(Object.keys(d).length){S.docs=d;S.example=false}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(dataKey(),JSON.stringify(S.docs))}catch(e){toast("Couldn't save. This phone's storage may be full.")}}
const timers={};
function save(id,data){
  if(S.example){S.docs={settings:S.docs.settings||DEFAULT_SETTINGS};S.example=false;
    if(S.col){S.col.doc("settings").set(clone(S.docs.settings)).catch(()=>{})}}
  if(data&&typeof data==="object")data._t=Date.now();
  S.docs[id]=data;render();window.Cloud&&Cloud.queue(id);
  if(S.col){clearTimeout(timers[id]);timers[id]=setTimeout(()=>{S.col.doc(id).set(clone(data)).catch(e=>toast("Couldn't save: "+(e&&e.message||"try again"))).finally(()=>{delete timers[id]})},500)}
  else saveLocal();
}
function remove(id){delete S.docs[id];window.Cloud&&Cloud.markDeleted(id);render();if(S.col){S.col.doc(id).delete().catch(()=>toast("Couldn't delete, try again"))}else saveLocal()}
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg,opt){const t=document.getElementById("toast");t.innerHTML="";const sp=document.createElement("span");sp.textContent=msg;t.appendChild(sp);
  if(opt&&opt.undo){const b=document.createElement("button");b.className="undo";b.type="button";b.textContent="Undo";b.onclick=()=>{t.hidden=true;opt.undo();toast("Undone")};t.appendChild(b)}
  t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,opt&&opt.undo?6000:2600)}
// put a doc back exactly as it was (for Undo)
function restoreDoc(id,prev){if(prev)save(id,prev);else remove(id)}

const settings=()=>{const s=S.docs.settings||DEFAULT_SETTINGS;return (s.targets&&s.targets.kcal!=null)?s:{...s,targets:DEFAULT_TARGETS}};
function dayDoc(k){return S.docs["day_"+k]||{type:"day",date:k,foods:[],habits:{}}}
// the day to change: a clean one while example data is showing, so your first entry replaces the examples
function editDay(){return S.example?{type:"day",date:S.day,foods:[],habits:{}}:clone(dayDoc(S.day))}
// habits-only mode hides calorie and macro numbers everywhere (for anyone better off not counting)
const NUM=()=>!(S.docs.profile&&S.docs.profile.habitsOnly);
const kcalFloor=sex=>sex==="f"?1200:sex==="m"?1500:1350;
function lowKcalWarn(kcal,sex){const f=kcalFloor(sex);if(!(+kcal>0)||+kcal>=f)return"";
  return `<div class="hint small"><b>That's below the usual safe minimum of ${f.toLocaleString("en-GB")} kcal a day.</b><span>Very low targets can harm health, energy and training. Only use them with your coach or a health professional's guidance.</span></div>`}
const ML=()=>{const m=macroLeft();return m?" · "+m:""};
function macroLeft(){if(!NUM())return "";const t=totals(dayDoc(S.day)),tg=settings().targets,l=Math.round(tg.kcal-t.kcal),p=Math.round(tg.protein-t.protein);
  return (l>=0?l.toLocaleString("en-GB")+" kcal left":Math.abs(l).toLocaleString("en-GB")+" kcal over")+(p>0?", "+p+"g protein to go":", protein hit")}
function totals(d){const t={kcal:0,protein:0,carbs:0,fat:0};(d.foods||[]).forEach(f=>MK.forEach(k=>t[k]+=+f[k]||0));return t}
const ofType=t=>Object.entries(S.docs).filter(([,d])=>d&&d.type===t).map(([id,d])=>({id,...d})).sort((a,b)=>a.date<b.date?1:-1);

/* ---------- render ---------- */
const ICONS={
  today:'<svg viewBox="0 0 24 24"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V11M16 11V7a1.5 1.5 0 0 1 3 0v6.5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.4-2.9L4 14.4a1.5 1.5 0 0 1 2.4-1.8L7 13.5"/></svg>',
  train:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
  body:'<svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>',
  checkin:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 13l3 3 5-6"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'};
const TABS=[["today","Today"],["train","Train"],["body","Body"],["checkin","Check-in"],["settings","Settings"]];
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${ICONS[k]}${l}</button>`).join("")}

function exampleBanner(){return S.example?`<div class="banner"><span>Showing example data. Your first entry replaces it.</span><button class="btn ghost" data-act="clearEx">Start fresh</button></div>`:""}

function foodForm(f,i){if(!NUM())setTimeout(()=>document.querySelectorAll('form[data-form="food"] .macrof').forEach(e=>e.hidden=true),0);
  const v=k=>f&&f[k]!=null&&f[k]!==""?f[k]:"";
  return `<form class="editform" data-form="food" data-i="${i}">
    <label class="field wide"><span class="label">Food</span><input id="ef_name" value="${esc(v("name"))}" placeholder="e.g. Chicken wrap" required></label>
    <label class="field wide"><span class="label">Meal</span><select id="ef_meal">${MEALS.map(([k,l])=>`<option value="${k}" ${((f&&f.meal)||S.addTo||defaultMeal())===k?"selected":""}>${l}</option>`).join("")}</select></label>
    ${f&&f.base?(f.unit==="g"?`<label class="field wide"><span class="label">Amount eaten (g)</span><input id="ef_g" type="number" step="any" min="0" inputmode="decimal" value="${Math.round(f.qty)}" data-act="amtG"></label>`
      :`<label class="field ${f.unitG?"":"wide"}" style="${f.unitG?"grid-column:span 2":""}"><span class="label">Amount (× ${esc(f.unit)})</span><input id="ef_qty" type="number" step="any" min="0" inputmode="decimal" value="${f.qty}" data-act="amtQty"></label>
        ${f.unitG?`<label class="field" style="grid-column:span 2"><span class="label">Or grams</span><input id="ef_g" type="number" step="any" min="0" inputmode="decimal" value="${Math.round(f.qty*f.unitG)}" data-act="amtG"></label>`:""}`)
      +`<span class="small muted wide macrof">Change the amount and the macros below update to match.</span>`:""}
    <label class="field macrof"><span class="label">Protein g</span><input id="ef_protein" type="number" step="any" inputmode="decimal" value="${v("protein")}"></label>
    <label class="field macrof"><span class="label">Carbs g</span><input id="ef_carbs" type="number" step="any" inputmode="decimal" value="${v("carbs")}"></label>
    <label class="field macrof"><span class="label">Fat g</span><input id="ef_fat" type="number" step="any" inputmode="decimal" value="${v("fat")}"></label>
    <label class="field macrof"><span class="label">kcal</span><input id="ef_kcal" type="number" step="any" inputmode="numeric" value="${v("kcal")}" placeholder="auto"></label>
    <span class="small muted wide macrof">Leave calories blank to work them out from the macros.</span>
    <div class="acts"><button class="btn primary" type="submit">${i==="new"?"Add food":"Save changes"}</button><button class="btn" type="button" data-act="cancelFood">Cancel</button>${i!=="new"?`<button class="btn ghost" type="button" data-act="delFood" data-i="${i}">Delete</button>`:""}</div>
  </form>`}
function renderToday(){
  const d=dayDoc(S.day), st=settings(), tg=st.targets, tot=totals(d);
  const rows=MK.map(k=>{
    const v=Math.round(tot[k]),t=+tg[k]||0,pct=t?Math.min(100,v/t*100):0,left=t-v;
    return `<div class="macro" style="--c:${MAC[k].c}">
      <div class="pname"><b>${MAC[k].label}</b></div>
      <div class="count">${v.toLocaleString("en-GB")}<small> / ${t.toLocaleString("en-GB")}${MAC[k].unit==="g"?"g":""}</small></div>
      <div class="bar ${v>t&&t?"over":""}" role="progressbar" aria-label="${MAC[k].label}" aria-valuenow="${v}" aria-valuemax="${t}"><i style="width:${pct}%"></i></div>
      <div class="left">${left>=0?left.toLocaleString("en-GB")+(MAC[k].unit==="g"?"g":" kcal")+" left":Math.abs(left).toLocaleString("en-GB")+(MAC[k].unit==="g"?"g":" kcal")+" over"}</div>
    </div>`}).join("");
  const habits=st.habits.map((h,i)=>`<label class="habit"><input type="checkbox" id="hab${i}" data-act="habit" data-h="${esc(h)}" ${d.habits&&d.habits[h]?"checked":""}><span>${esc(h)}</span></label>`).join("");
  const done=st.habits.filter(h=>d.habits&&d.habits[h]).length;
  const foodRow=(f,i)=>S.editFood===i?foodForm(f,i):`<div class="food"><div style="min-width:0"><div class="nm">${esc(f.name)}</div>
    <div class="meta">${f.base&&f.qty!=null?fmtQty(f)+(NUM()?" · ":""):""}${NUM()?`${Math.round(+f.kcal||0)} kcal · P ${fmtN(+f.protein||0)}g · C ${fmtN(+f.carbs||0)}g · F ${fmtN(+f.fat||0)}g`:""}</div></div>
    <div class="fbtns"><button class="star" data-act="favFood" data-i="${i}" aria-pressed="${isFav(f)}" aria-label="${isFav(f)?"Remove from":"Add to"} favourites">${isFav(f)?"★":"☆"}</button><button class="btn ghost" data-act="editFood" data-i="${i}" aria-label="Edit ${esc(f.name)}">Edit</button></div></div>`;
  const all=(d.foods||[]).map((f,i)=>[f,i]),yd=dayDoc(addDays(S.day,-1));
  const grp=(k,l,items)=>{const kc=items.reduce((a,[f])=>a+(+f.kcal||0),0),yItems=k?(yd.foods||[]).filter(f=>f.meal===k):[];
    return `<div class="mealgrp"><div class="spread"><span><b>${l}</b> <span class="small muted">${items.length&&NUM()?Math.round(kc).toLocaleString("en-GB")+" kcal":""}</span></span>
      ${k?`<span class="row" style="gap:0;flex-wrap:nowrap">${!items.length&&yItems.length?`<button class="btn ghost" style="font-size:13px" data-act="copyMeal" data-m="${k}">Same as yesterday</button>`:""}<button class="btn ghost" data-act="addTo" data-m="${k}" data-focus="1" aria-label="Add to ${l}">+ Add</button></span>`:""}</div>
      ${items.map(([f,i])=>foodRow(f,i)).join("")}</div>`};
  const other=all.filter(([f])=>!MEALS.some(m=>m[0]===f.meal));
  const foods=MEALS.map(([k,l])=>grp(k,l,all.filter(([f])=>f.meal===k))).join("")+(other.length?grp(null,"Other",other):"");
  S.quick=quickFoods();
  const quick=S.quick.length?`<div class="label" style="margin-top:2px">Quick add</div><div class="chiprow">${S.quick.map((x,i)=>`<button class="qchip" data-act="quickAdd" data-i="${i}">${x.fav?"★ ":""}${esc(x.f.name)}${NUM()?` <span class="muted">${Math.round(+x.f.kcal||0)}</span>`:""}</button>`).join("")}</div>`:"";
  const results=S.results.map((r,i)=>`<div class="result"><div style="min-width:0"><div class="nm" style="font-weight:600">${esc(r.name)}</div>
    <div class="meta small muted">${r.serving?esc(r.serving):""}${NUM()?`${r.serving?" · ":""}${Math.round(r.kcal||0)} kcal · P ${Math.round(r.protein_g||0)}g · C ${Math.round(r.carbs_g||0)}g · F ${Math.round(r.fat_g||0)}g`:""}</div></div>
    <button class="btn primary" data-act="addRes" data-i="${i}">Add</button></div>`).join("");
  const isToday=S.day===todayKey();
  return `${exampleBanner()}${isToday?backupBanner():""}
  <header class="top"><div><h1>${isToday?"Today":fmtDay(S.day)}</h1><div class="sub">${PROF.list.length>1?esc(activeProf().name)+" · ":""}${isToday?fmtDay(S.day):"Viewing a past day"}</div></div>
    <div class="daynav"><button data-act="prevDay" aria-label="Previous day">‹</button><button data-act="nextDay" aria-label="Next day" ${isToday?"disabled":""}>›</button></div></header>
  <div class="stack">
  ${quoteCard()}
  ${NUM()?`<section class="panel"><div class="spread"><h2>Macros</h2><button class="btn ghost" data-act="targets">${S.showTargets?"Done":"Edit targets"}</button></div>
    ${S.showTargets?renderTargets():""}
    <div>${rows}</div>
  </section>`:`<section class="panel"><h2>Today</h2><div class="tiles">${glanceTile("Meals logged",MEALS.filter(([k])=>(d.foods||[]).some(f=>f.meal===k)).length+"/4","")}${glanceTile("Habits",(st.habits||[]).filter(h=>d.habits&&d.habits[h]).length+"/"+(st.habits||[]).length,"")}</div>
    <span class="small muted">Numbers are hidden (habits-only mode). Focus on regular meals, protein with each meal, and how you feel.</span></section>`}
  <section class="panel" id="logPanel"><h2>Log food</h2>
    <div class="mealpick" role="group" aria-label="Add to meal">${MEALS.map(([k,l])=>`<button data-act="addTo" data-m="${k}" aria-pressed="${(S.addTo||(S.addTo=defaultMeal()))===k}">${l}</button>`).join("")}</div>
    <form class="row" id="searchForm" style="flex-wrap:nowrap"><input id="q" placeholder="Food, brand or barcode" autocomplete="off" enterkeyhint="search"><button class="btn primary" type="submit" ${S.searching?"disabled":""}>Search</button></form>
    <div class="row"><button class="btn" data-act="photo" ${S.searching?"disabled":""}>Scan barcode or label</button><button class="btn" data-act="newFood">Add manually</button></div>
    ${quick}
    ${mealCard()}
    <div class="status" aria-live="polite">${esc(S.searchMsg)}</div>
    ${results?`<div class="stack" style="gap:8px">${results}</div>`:""}
    ${S.editFood==="new"?foodForm(null,"new"):""}
  </section>
  <section class="panel"><div class="spread"><h2>${isToday?"Today's food":"Food this day"}</h2><span class="label">${all.length&&NUM()?Math.round(tot.kcal).toLocaleString("en-GB")+" kcal":""}</span></div>
    ${all.length?"":`<p class="muted small" style="margin:0">Nothing logged yet. Pick a meal above, then search, tap a quick add, or add manually.</p>`}
    <div class="stack" style="gap:0">${foods}</div>
  </section>
  <section class="panel"><div class="spread"><h2>Daily habits</h2>${S.editHabits?`<span class="label">Editing</span>`:`<div class="row" style="gap:4px"><span class="label">${done} / ${st.habits.length}</span><button class="btn ghost" data-act="editHabits">Edit</button></div>`}</div>
    ${S.editHabits?renderHabitEditor():`<div>${habits||'<p class="muted small" style="margin:0">No habits yet. Tap Edit to add some.</p>'}</div>`}</section>
  </div>`;
}
function renderHabitEditor(){const H=S.editHabits;
  return `<div class="stack" style="gap:8px;background:var(--sunk);border-radius:10px;padding:12px">
    ${H.map((h,i)=>`<div class="hrow"><input id="he${i}" value="${esc(h.name)}" data-act="habName" data-i="${i}" aria-label="Habit ${i+1}">
      <button class="hb" data-act="habUp" data-i="${i}" aria-label="Move up" ${i===0?"disabled":""}>↑</button>
      <button class="hb" data-act="habDown" data-i="${i}" aria-label="Move down" ${i===H.length-1?"disabled":""}>↓</button>
      <button class="hb del" data-act="habDel" data-i="${i}" aria-label="Remove ${esc(h.name)}">×</button></div>`).join("")||'<p class="muted small" style="margin:0">No habits. Add one below.</p>'}
    <form class="row" id="habAddForm" style="flex-wrap:nowrap;margin-top:4px"><input id="habNew" placeholder="Add a habit, e.g. 10 min mobility" autocomplete="off" enterkeyhint="done"><button class="btn" type="submit">Add</button></form>
    <span class="small muted">Renaming a habit keeps today's tick. Removed habits drop off the daily list; past days aren't changed.</span>
    <div class="row"><button class="btn primary" data-act="saveHabits">Save habits</button><button class="btn" data-act="cancelHabits">Cancel</button></div></div>`}
function renderTargets(){const st=settings(),t=st.targets,mk=macroKcal(t);
  return `<div class="stack" style="gap:10px;background:var(--sunk);border-radius:10px;padding:12px">${lowKcalWarn(t.kcal,(S.docs.profile||{}).sex)}
    <div class="grid2">${MK.map(k=>`<label class="field"><span class="label">${MAC[k].label} (${MAC[k].unit}/day)</span><input type="number" min="0" step="1" inputmode="numeric" id="tg_${k}" data-act="target" data-k="${k}" value="${t[k]}"></label>`).join("")}</div>
    <div class="spread small"><span class="muted">Your macros add up to <b style="color:var(--fg)">${mk.toLocaleString("en-GB")} kcal</b></span>${mk!==+t.kcal?`<button class="btn ghost" data-act="matchKcal">Use ${mk.toLocaleString("en-GB")}</button>`:""}</div>
    </div>`}

function renderTrain(){
  const wo=ofType("workout"), dw=S.draftWorkout;
  let editor="";
  if(dw){editor=`<section class="panel"><div class="spread"><h2>New session</h2><button class="btn ghost" data-act="cancelWo">Cancel</button></div>
    <div class="grid2"><label class="field"><span class="label">Session name</span><input id="woName" value="${esc(dw.name)}" data-act="woName" placeholder="e.g. Upper A"></label>
    <label class="field"><span class="label">Date</span><input type="date" id="woDate" value="${dw.date}" data-act="woDate"></label></div>
    ${dw.exercises.map((ex,ei)=>`<div class="ex"><div class="row" style="flex-wrap:nowrap"><input id="exn${ei}" value="${esc(ex.name)}" data-act="exName" data-ei="${ei}" placeholder="Start typing, e.g. bench" list="exlib" autocomplete="off"><button class="x" data-act="delEx" data-ei="${ei}" aria-label="Remove exercise">×</button></div>
      ${lastLine(ex.name,ei)}
      <div class="set"><span></span><span class="label">kg</span><span class="label">Reps</span><span class="label" style="text-align:center">Done</span><span></span></div>

const LIB_GROUP={};Object.entries(EX_LIB).forEach(([g,l])=>l.forEach(n=>LIB_GROUP[n.toLowerCase()]=g));
const exKey=n=>String(n||"").trim().toLowerCase();
// every logged instance of an exercise, newest first (example data excluded once real data exists)
function exHistory(name){const k=exKey(name);if(!k)return[];const out=[];
  ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{if(exKey(e.name)===k&&e.sets&&e.sets.length)out.push({date:w.date,session:w.name,sets:e.sets})}));return out}
const e1rm=s=>(+s.kg||0)*(1+(+s.reps||0)/30);
function bestSet(sets){return sets.reduce((b,s)=>!b||e1rm(s)>e1rm(b)?s:b,null)}
const fmtSets=sets=>sets.map(s=>`${fmtN(+s.kg||0)}×${s.reps||0}`).join(", ");
function exOptions(){const mine=new Map();ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{const k=exKey(e.name);if(k&&!LIB_GROUP[k]&&!mine.has(k))mine.set(k,e.name.trim())}));
  return [...mine.values()].map(n=>`<option value="${esc(n)}" label="Your exercise">`).join("")+Object.entries(EX_LIB).map(([g,l])=>l.map(n=>`<option value="${esc(n)}" label="${esc(g)}">`).join("")).join("")}
function lastLine(name,ei){if(!exKey(name))return"";const h=exHistory(name);
  if(!h.length)return `<div class="lastline small muted">First time logging this. Today sets your baseline.</div>`;
  const l=h[0],b=bestSet(h.flatMap(x=>x.sets));
  return `<div class="lastline small"><div><span class="muted">Last time (${fmtDay(l.date)}):</span> ${fmtSets(l.sets)}</div>
    <div class="muted">Best: ${fmtN(+b.kg||0)} kg × ${b.reps} · est. 1RM ${fmtN(Math.round(e1rm(b)*2)/2)} kg</div>
    <button class="btn ghost" style="padding:4px 0" data-act="useLast" data-ei="${ei}">Copy last time's sets</button></div>`}
function exSpark(h){const pts=h.slice(0,10).reverse().map(x=>e1rm(bestSet(x.sets)));if(pts.length<2)return"";
  const W=120,H=32,lo=Math.min(...pts),hi=Math.max(...pts),r=hi-lo||1;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map((v,i)=>`${(i*(W-4)/(pts.length-1)+2).toFixed(1)},${(H-3-(v-lo)/r*(H-6)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>`}
function renderExercises(){
  const map=new Map();ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{const k=exKey(e.name);if(k&&!map.has(k))map.set(k,e.name.trim())}));
  if(!map.size)return"";
  const q=exKey(S.exFilter);
  const rows=[...map.entries()].filter(([k])=>!q||k.includes(q)).map(([k,name])=>{const h=exHistory(name),b=bestSet(h.flatMap(x=>x.sets)),open=S.openEx===k;
    return `<div class="item"><button class="exhead" data-act="openEx" data-k="${esc(k)}" aria-expanded="${open}">

      <span class="small" style="text-align:right;font-variant-numeric:tabular-nums;flex:none">${fmtN(+b.kg||0)} kg × ${b.reps}<span class="muted" style="display:block">est. 1RM ${fmtN(Math.round(e1rm(b)*2)/2)}</span></span></button>
      ${open?`<div class="exdetail">${exSpark(h)?`<div class="small muted">Est. 1RM trend</div>${exSpark(h)}`:""}
        ${h.map(x=>`<div class="spread small" style="padding:4px 0;border-top:1px solid var(--line)"><span class="muted">${fmtDay(x.date)}${x.session?" · "+esc(x.session):""}</span><span style="font-variant-numeric:tabular-nums;text-align:right">${fmtSets(x.sets)}</span></div>`).join("")}</div>`:""}</div>`}).join("");
  return `<section class="panel"><div class="spread"><h2>Exercise history</h2><span class="label">${map.size} exercise${map.size===1?"":"s"}</span></div>

// 7-day average: for each weigh-in, the mean of weigh-ins in the 7 days up to it
function rollAvg(pts){return pts.map(p=>{const from=addDays(p.date,-6),win=pts.filter(q=>q.date>=from&&q.date<=p.date);return win.reduce((a,q)=>a+(+q.weight),0)/win.length})}
function weightChart(list){
  const all=list.filter(b=>b.weight).slice().reverse(),cut=addDays(todayKey(),-90),pts=all.filter(p=>p.date>=cut);
  if(pts.length<2)return `<p class="muted small" style="margin:0">Log at least two weigh-ins to see your trend. Weighing 3–7 times a week, first thing in the morning, gives the clearest picture.</p>`;
  const avg=rollAvg(all).slice(all.length-pts.length),ws=pts.map(p=>+p.weight);
  const W=320,H=150,L=34,R=10,T=12,B=22;let lo=Math.floor(Math.min(...ws)-.5),hi=Math.ceil(Math.max(...ws)+.5);
  const d0=new Date(pts[0].date).getTime(),span=Math.max(1,new Date(pts[pts.length-1].date).getTime()-d0);
  const x=p=>L+(new Date(p.date).getTime()-d0)/span*(W-L-R),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(v)}</text>`).join("");
  const dots=pts.map(p=>`<circle cx="${x(p).toFixed(1)}" cy="${y(+p.weight).toFixed(1)}" r="2.6" fill="var(--muted)" opacity=".55"><title>${fmtDay(p.date)}: ${fmtN(+p.weight)} kg</title></circle>`).join("");
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(p).toFixed(1)},${y(avg[i]).toFixed(1)}`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight with 7-day average">${ticks}${dots}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(last).toFixed(1)}" cy="${y(avg[avg.length-1]).toFixed(1)}" r="4" fill="var(--accent)"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtDay(pts[0].date)}</text><text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtDay(last.date)}</text></svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>7-day average</span><span><i style="background:var(--muted);border-radius:50%"></i>Daily weigh-ins</span></div>`}
function weightStats(list){const all=list.filter(b=>b.weight).slice().reverse();if(!all.length)return"";
  const av=rollAvg(all),now=av[av.length-1],wk=addDays(todayKey(),-7),before=all.map((p,i)=>[p,av[i]]).filter(([p])=>p.date<=wk).pop();
  const ch=before?r1(now-before[1]):null,tot=all.length>1?r1(av[av.length-1]-(+all[0].weight)):null;
  return `<div class="tiles">${glanceTile("7-day avg",fmtN(r1(now)),"kg")}${glanceTile("This week",ch==null?"—":(ch>0?"+":"")+fmtN(ch),ch==null?"need a week of data":"kg vs last week")}${glanceTile("Overall",tot==null?"—":(tot>0?"+":"")+fmtN(tot),"kg since "+fmtDay(all[0].date).replace(/^\w+, /,""))}</div>`}
function renderBody(){

    <div class="spread"><span class="small muted">${M.slice(1).filter(([k])=>b[k]).map(([k,l])=>l.replace(" (cm)","")+" "+b[k]+" cm").join(" · ")||"&nbsp;"}</span><button class="x" data-act="delBody" data-id="${b.id}" aria-label="Delete entry">×</button></div></div>`).join("")||'<p class="muted small" style="margin:0">No entries yet.</p>'}</div>${list.length>10?`<button class="btn ghost" style="align-self:flex-start" data-act="bodyAll">${S.bodyAll?"Show fewer":"Show all "+list.length}</button>`:""}</section></div>`;

function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function glanceTile(label,val,sub,tone){return `<div class="tile"><span class="label">${label}</span><b>${val}</b>${sub?`<span class="small ${tone||"muted"}">${sub}</span>`:""}</div>`}

  return `<section class="panel"><div class="spread"><h2>Your week so far</h2><span class="label">auto</span></div><div class="tiles">${(tiles||tiles2).join("")}</div></section>`}

const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,half:0.5,"½":0.5,quarter:0.25,couple:2};
const r1=n=>Math.round(n*10)/10;
function scaleFood(base,qty){const o={};["kcal","protein","carbs","fat"].forEach(k=>o[k]=k==="kcal"?Math.round(base[k]*qty):r1(base[k]*qty));return o}
function matchFood(part){let best=null,len=0;
  FOOD_DB.forEach(f=>f.words.forEach(w=>{const re=new RegExp("(^|[^a-z])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(e?s)?($|[^a-z])");if(w.length>len&&re.test(part)){best=f;len=w.length}}));return best}
// "2 eggs and beans on toast" -> [{food, qty}], plus parts it couldn't match
function estimateMeal(q){const parts=q.toLowerCase().replace(/[()]/g," ").split(/\s*(?:,|\+|&|\band\b|\bwith\b|\bon\b|\bplus\b)\s*/).map(x=>x.trim()).filter(Boolean);
  const items=[],missed=[];
  parts.forEach(pt=>{const f=matchFood(pt);if(!f){missed.push(pt);return}
    let qty=1,m;
    if((m=pt.match(/(\d+(?:\.\d+)?)\s*(g|grams?|ml)\b/)))qty=+m[1]/f.unitG;
    else if((m=pt.match(/^(\d+(?:\.\d+)?)\s*x?\b/))||(m=pt.match(/\bx\s*(\d+(?:\.\d+)?)\b/)))qty=+m[1];
    else if((m=pt.match(/^(a|an|one|two|three|four|five|six|half|½|quarter|couple)\b/)))qty=NUMW[m[1]];
    items.push({name:f.name,unit:f.unit,unitG:f.unitG,base:f.per,qty:r1(qty)})});
  return items.length?{q,items,missed}:null}
const mealTotals=items=>items.reduce((t,it)=>{const s=scaleFood(it.base,it.qty);Object.keys(t).forEach(k=>t[k]+=s[k]);return t},{kcal:0,protein:0,carbs:0,fat:0});
const fmtQty=it=>it.unit==="g"?`${Math.round(it.qty)}g`:`${fmtN(it.qty)} × ${it.unit}`;

  const st=actx.currentTime+t;g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(0.35,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+0.25);o.start(st);o.stop(st+0.27)})}catch(e){}}

function weekSummary(ws,withNotes){const st=settings(),tg=st.targets,hs=st.habits||[],end=addDays(ws,6),o={week:ws};
  const bodies=ofType("body").filter(b=>b.date>=ws&&b.date<=end),wt=bodies.filter(b=>b.weight).map(b=>+b.weight);
  if(wt.length)o.weight=r1(wt.reduce((a,b)=>a+b,0)/wt.length);
  ["waist","hips","chest","arm","thigh"].forEach(k=>{const b=bodies.find(x=>x[k]);if(b)o[k]=+b[k]});
  let logged=0,kc=0,pr=0,hit=0,ticks=0;
  for(let i=0;i<7;i++){const d=S.docs["day_"+addDays(ws,i)];if(!d)continue;
    if((d.foods||[]).length){logged++;const t=totals(d);kc+=t.kcal;pr+=t.protein;if(Math.abs(t.kcal-tg.kcal)<=tg.kcal*.1&&t.protein>=tg.protein*.9)hit++}
    if(d.habits)ticks+=hs.filter(h=>d.habits[h]).length}
  o.daysLogged=logged;if(logged){o.kcal=Math.round(kc/logged);o.protein=Math.round(pr/logged);o.onTarget=hit}
  if(hs.length)o.habitsPct=Math.round(ticks/(7*hs.length)*100);
  const wo=ofType("workout").filter(w=>w.date>=ws&&w.date<=end);
  o.sessions=wo.length;o.sets=wo.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.length,0),0);
  o.volume=Math.round(wo.reduce((a,w)=>a+w.exercises.reduce((b,e)=>b+e.sets.reduce((c,x)=>c+(+x.kg||0)*(+x.reps||0),0),0),0));
  const ci=S.docs["ci_"+ws];if(ci){CQ.forEach(([k])=>{if(ci[k])o[k]=ci[k]});if(withNotes)["win","struggle","focus"].forEach(k=>{if(ci[k])o[k]=ci[k]})}
  return o}

    let d="",pen=false,dots="";weeks.forEach((w,i)=>{const v=w[sr.key];if(v==null||v==="")return;d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);pen=true;dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" fill="${sr.color}"><title>${fmtDay(w.week)}: ${v}</title></circle>`});

async function doAuth(kind){const c=await sbClient();if(!c){toast("Can't reach the account service. Check your connection");return}
  const email=(document.getElementById("au_email")||{}).value?.trim(),pw=(document.getElementById("au_pw")||{}).value||"";
  if(!email||!/@/.test(email)){toast("Enter your email");return}
  if(kind==="forgot"){const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});CL.authHint=null;cloudRender();toast(error?authMsg(error):"Password reset email sent to "+email);return}
  if(pw.length<8){toast("Password must be at least 8 characters");return}
  if(kind==="up"&&!(document.getElementById("au_consent")||{}).checked){CL.authHint=CL.authHint||{email,pw};CL.authHint.email=email;CL.authHint.pw=pw;toast("Tick the box to agree to the privacy notice first");document.getElementById("au_consent")?.focus();return}
  CL.busy=true;cloudRender();
  const {data,error}=kind==="up"?await c.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname,data:{privacy_version:PRIVACY_VERSION,privacy_accepted_at:new Date().toISOString()}}}):await c.auth.signInWithPassword({email,password:pw});
  CL.busy=false;
  if(error){const m=error.message||"";
    // Supabase answers the same for "no account" and "wrong password", so offer both next steps
    if(kind==="in"&&/Invalid login/i.test(m)){CL.authHint={type:"nomatch",email,pw};cloudRender();return}
    if(kind==="up"&&/already registered/i.test(m)){CL.authHint={type:"exists",email};cloudRender();return}
    toast(authMsg(error));cloudRender();return}
  CL.authHint=null;if(kind==="up")save("profile",{...(S.docs.profile||{type:"profile",name:activeProf().name}),consent:{privacy:PRIVACY_VERSION,at:new Date().toISOString()}});
  if(kind==="up"&&!data.session){toast("Check your email to confirm your account, then sign in here");cloudRender();return}
  CL.user=data.user;CL.status="ok";toast("Signed in. Syncing your data");fullSync()}

const SET_PAGES=[["profile","Profile & account","Name, contact details, body stats and goal"],["cloud","Cloud account","Back up online, sync phones, share with a coach"],["users","Users","Add friends or clients, each with their own data"],["targets","Targets & habits","Calories, macros and daily habits"],["rest","Rest timer","Rest length, sound, vibration and notifications"],["look","Appearance","App colour, quote backdrop, light or dark"],["data","Data & backup","Save a backup or move data to a new phone"],["about","About","How your data is stored"]];
const GOALS={lose:"Lose fat",maintain:"Maintain",gain:"Build muscle",perform:"Performance"};
const ACT=[["1.2","Mostly sitting, little exercise"],["1.375","Light: 1–3 sessions a week"],["1.55","Moderate: 3–5 sessions a week"],["1.725","Very active: 6–7 sessions or a physical job"]];
const initials=n=>String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
const latestWeight=()=>{if(S.example)return null;const b=ofType("body").find(x=>x.weight);return b?+b.weight:null};
function ageFrom(dob){if(!dob)return null;const d=new Date(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a>0&&a<110?a:null}
function suggestTargets(){const p=S.docs.profile||{};return suggestFrom(p,latestWeight()||p.weight)}
function suggestFrom(p,wt){const w=+wt,h=+p.height,a=ageFrom(p.dob);
  if(!w||!h||!a||!p.sex||!p.activity||a<18)return null;
  const bmr=10*w+6.25*h-5*a+(p.sex==="m"?5:-161),tdee=bmr*(+p.activity),adj={lose:0.8,maintain:1,gain:1.1,perform:1.05}[p.goal]||1;
  // never suggest below the sex-based minimum or below resting needs (BMR)
  const floor=Math.max(kcalFloor(p.sex),Math.ceil(bmr/10)*10),raw=Math.round(tdee*adj/10)*10,capped=raw<floor;
  const kcal=Math.max(raw,floor),protein=Math.round(w*(p.goal==="lose"?2.2:2)),fat=Math.round(kcal*0.25/9),carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));
  return {kcal,protein,carbs,fat,tdee:Math.round(tdee),capped,floor}}

/* ---------- food search outside Claude: Open Food Facts (free UK food database) ---------- */
const OFF="https://uk.openfoodfacts.org";
function offItem(p){const n=p.nutriments||{},name=[p.product_name||p.generic_name,p.brands&&p.brands.split(",")[0]].filter(Boolean).join(" · ");if(!name)return null;
  const per=n["energy-kcal_serving"]!=null&&p.serving_size?"_serving":"_100g",g=k=>+(n[k+per]||0);
  let kcal=g("energy-kcal");if(!kcal&&n["energy"+per])kcal=n["energy"+per]/4.184;
  if(!kcal&&!g("proteins")&&!g("carbohydrates"))return null;
  return {name,serving:per==="_serving"?p.serving_size:"per 100g",kcal:Math.round(kcal),protein_g:g("proteins"),carbs_g:g("carbohydrates"),fat_g:g("fat")}}
async function offSearch(q){
  const code=q.replace(/\s/g,"");
  if(/^\d{8,14}$/.test(code)){const r=await fetch(`${OFF}/api/v2/product/${code}.json?fields=product_name,generic_name,brands,serving_size,nutriments`);const j=await r.json();const it=j&&j.product&&offItem(j.product);return it?[it]:[]}
  const r=await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&fields=product_name,generic_name,brands,serving_size,nutriments`);
  const j=await r.json();return (j.products||[]).map(offItem).filter(Boolean).slice(0,6)}
async function readBarcode(img){if(!("BarcodeDetector" in window))return null;try{const bd=new BarcodeDetector();const bmp=await createImageBitmap(img);const c=await bd.detect(bmp);return c[0]&&c[0].rawValue||null}catch(e){return null}}
async function runOffSearch(q,img){
  S.searching=true;S.results=[];S.searchMsg=img?"Reading the barcode…":"Searching…";render();
  try{
    if(img){const code=await readBarcode(img);if(!code){S.searchMsg="Couldn't read a barcode from that photo. Type the numbers under the barcode into search instead.";S.searching=false;render();return}q=code}
    S.results=await offSearch(q);
    S.searchMsg=S.results.length?(S.meal?"Branded products from Open Food Facts:":"From Open Food Facts. Tap Add, then Edit to change the amount."):S.meal?"":"No match. Try a brand name (e.g. 'Warburtons crumpets'), the barcode number, or add it manually.";
  }catch(e){S.searchMsg="Search didn't work. Check your connection and try again, or add it manually."}
  S.searching=false;render();
}
async function runSearch(q,img){
  const sample=await getSample();
  if(!sample){return runOffSearch(q,img)}
  S.searching=true;S.results=[];S.searchMsg=img?"Reading your photo…":"Searching…";render();
  try{
    const input=img?FOOD_PROMPT+"\n\nThe attached photo shows a product barcode, nutrition label, packaging or a plate of food. Identify the product or meal and estimate one typical serving."+(q?" Extra note: "+q:""):FOOD_PROMPT+"\n\nFood: "+q;
    const res=await sample.json(input,img?{images:[img],modelTier:"default"}:{modelTier:"quick"});
    S.results=(res&&res.items)||[];S.searchMsg=S.results.length?"Estimates. Tap Add to log one.":"No match found. Try describing it differently.";
  }catch(e){S.searchMsg=e&&e.code==="not_granted"?"Allow Claude access for this page to use food search.":e&&e.code==="rate_limited"?"Too many searches just now. Wait a minute and try again.":"Search didn't work. Try again."}
  S.searching=false;render();
}

  if(ds.act==="shareHealth"){save("profile",{...(S.docs.profile||{}),shareHealth:t.checked});window.Cloud&&CL.user&&pushReports(true)}
  if(ds.act==="habitsOnly"){const p=S.docs.profile||{type:"profile",name:activeProf().name};if(p.minor&&!t.checked){t.checked=true;toast("Numbers stay hidden for under-18s");return}save("profile",{...p,habitsOnly:t.checked});toast(t.checked?"Numbers hidden. Focus on habits and portions":"Calorie and macro numbers shown")}
  if(ds.act==="coachMode"){save("profile",{...(S.docs.profile||{type:"profile",name:activeProf().name}),coach:t.checked});if(t.checked){S.ciView="clients"};toast(t.checked?"Clients view added to Check-in":"Coach tools off")}
  if(ds.act==="shareWeeks"){S.share={...(S.share||{notes:true}),weeks:+t.value}}
  if(ds.act==="shareNotes"){S.share={...(S.share||{weeks:8}),notes:t.checked};render()}
  if(ds.act==="clientNotes"){const c=S.docs[ds.id];if(c)save(ds.id,{...c,notes:t.value})}
  if(ds.act==="restOpt"){const st=clone(settings()),c={...REST_DEF,...(st.rest||{})};
    if(ds.k==="notify"&&t.checked&&"Notification" in window&&Notification.permission!=="granted"){Notification.requestPermission().then(r=>{const s2=clone(settings());s2.rest={...REST_DEF,...(s2.rest||{}),notify:r==="granted"};save("settings",s2);if(r!=="granted")toast("Notifications weren't allowed")});return}
    c[ds.k]=t.checked;st.rest=c;save("settings",st)}
  if(ds.act==="target"){const st=clone(settings());st.targets[ds.k]=Math.max(0,Math.round(+t.value||0));save("settings",st)}
  if(ds.act==="woDate")S.draftWorkout.date=t.value;
  if(ds.act==="exName"){S.draftWorkout.exercises[+ds.ei].name=t.value;render()}
});
document.addEventListener("input",e=>{const t=e.target,ds=t.dataset;
  if(ds.act==="woName")S.draftWorkout.name=t.value;
  if(ds.act==="exName"){S.draftWorkout.exercises[+ds.ei].name=t.value;
    if(LIB_GROUP[exKey(t.value)]||exHistory(t.value).length)render()} // picked from the list: show last time straight away
  if(ds.act==="ob"){S.onboard.d[ds.k]=t.value}
  if(ds.act==="obT"){S.onboard.d.targets[ds.k]=t.value;if(ds.k==="kcal"){const w=document.getElementById("obWarn");if(w)w.innerHTML=lowKcalWarn(t.value,S.onboard.d.sex)}}
  if(ds.act==="exFilter"){S.exFilter=t.value;render()}
  if(ds.act==="amtQty"||ds.act==="amtG"){const f=dayDoc(S.day).foods[S.editFood];if(!f||!f.base)return;
    const qty=ds.act==="amtG"?(f.unit==="g"?+t.value:+t.value/f.unitG):+t.value;if(!(qty>=0))return;
    if(ds.act==="amtQty"&&f.unitG){const g=document.getElementById("ef_g");if(g)g.value=Math.round(qty*f.unitG)}
    if(ds.act==="amtG"&&f.unit!=="g"){const qn=document.getElementById("ef_qty");if(qn)qn.value=r1(qty*4)/4===qty?qty:Math.round(qty*100)/100}
    const sc=scaleFood(f.base,qty);["protein","carbs","fat","kcal"].forEach(k=>{document.getElementById("ef_"+k).value=sc[k]})}
  if(ds.act==="setKg")S.draftWorkout.exercises[+ds.ei].sets[+ds.si].kg=t.value;
  if(ds.act==="setReps")S.draftWorkout.exercises[+ds.ei].sets[+ds.si].reps=t.value;
  if(ds.act==="ciText")S.ciDraft[ds.k]=t.value;
  if(ds.act==="habName")S.editHabits[+ds.i].name=t.value;
});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.dataset.form==="food"){const g=id=>document.getElementById(id).value;const name=g("ef_name").trim();if(!name){toast("Give the food a name");return}
    const old=e.target.dataset.i!=="new"?dayDoc(S.day).foods[+e.target.dataset.i]:null;
    const f={...(old&&old.base?{base:old.base,unit:old.unit,unitG:old.unitG,qty:old.qty}:{}),name,protein:+g("ef_protein")||0,carbs:+g("ef_carbs")||0,fat:+g("ef_fat")||0};f.kcal=g("ef_kcal")!==""?Math.round(+g("ef_kcal")):macroKcal(f);
    f.meal=document.getElementById("ef_meal").value;
    if(f.base){const qe=document.getElementById("ef_qty"),ge=document.getElementById("ef_g");f.qty=f.unit==="g"?(+(ge&&ge.value)||0):(+(qe&&qe.value)||0)}
    const i=e.target.dataset.i;const x=i==="new"?editDay():clone(dayDoc(S.day));x.foods=x.foods||[];if(i==="new")x.foods.push(f);else x.foods[+i]=f;
    S.editFood=null;save("day_"+S.day,x);toast((i==="new"?"Added":"Saved")+ML());return}
  if(e.target.id==="authForm"){doAuth("in");return}
  if(e.target.id==="linkForm"){const v=document.getElementById("lk_code").value.trim().toUpperCase();if(v.length<4){toast("Enter your coach's code");return}linkCoach(v);return}
  if(e.target.id==="pwForm"){const pw=document.getElementById("au_newpw").value;if(pw.length<8){toast("Password must be at least 8 characters");return}
    sbClient().then(c=>c&&c.auth.updateUser({password:pw})).then(r=>{if(r&&r.error){toast(authMsg(r.error));return}CL.recover=false;toast("Password updated");render()});return}
  if(e.target.id==="profileForm"){const g=id=>document.getElementById(id).value.trim(),name=g("pf_name");if(!name){toast("Add a name");return}
    const pr={...(S.docs.profile||{}),type:"profile",name,email:g("pf_email"),phone:g("pf_phone"),dob:g("pf_dob"),sex:g("pf_sex"),height:g("pf_height")?+g("pf_height"):"",goal:g("pf_goal"),activity:g("pf_act"),notes:document.getElementById("pf_notes").value};
    const w=g("pf_weight"),lw=latestWeight();if(w)pr.weight=+w;
    save("profile",pr);
    if(w&&+w!==lw){const k=todayKey();save("body_"+k,{...(S.docs["body_"+k]||{type:"body",date:k}),weight:+w})}
    activeProf().name=name;saveProf();render();toast("Details saved");return}
  if(e.target.id==="userForm"){const name=document.getElementById("nu_name").value.trim(),pin=document.getElementById("nu_pin").value.trim();if(!name)return;
    if(pin&&!/^\d{4}$/.test(pin)){toast("PIN must be 4 digits");return}
    const id="u"+Date.now().toString(36),u={id,name};if(pin)u.pin=pin;PROF.list.push(u);saveProf();
    try{localStorage.setItem(dataKey(id),JSON.stringify({settings:clone(DEFAULT_SETTINGS),profile:{type:"profile",name}}))}catch(e){}
    render();toast(name+" added. Tap Switch to use their profile");return}
  if(e.target.id==="pinSetForm"){const pin=document.getElementById("ps_pin").value.trim();if(!/^\d{4}$/.test(pin)){toast("PIN must be 4 digits");return}activeProf().pin=pin;saveProf();render();toast("PIN set");return}
  if(e.target.id==="pinForm"){const L=S.lock,u=PROF.list.find(x=>x.id===L.id),v=document.getElementById("pinIn").value.trim();
    if(u&&v===u.pin){if(L.id===PROF.active){S.lock=null;render()}else switchUser(L.id,true)}else{L.err=true;render();document.getElementById("pinIn")?.focus()}return}
  if(e.target.id==="obHabitForm"){const inp=document.getElementById("ob_newhabit"),v=inp.value.trim();if(!v)return;const H=S.onboard.d.habits;if(!H.includes(v))H.push(v);render();document.getElementById("ob_newhabit")?.focus();return}
  if(e.target.id==="habAddForm"){const inp=document.getElementById("habNew"),v=inp.value.trim();if(!v){inp.focus();return}
    if(S.editHabits.some(h=>h.name.trim().toLowerCase()===v.toLowerCase())){toast("That habit's already on the list");return}
    S.editHabits.push({name:v,old:null});render();document.getElementById("habNew")?.focus();return}
  if(e.target.id==="searchForm"){const q=document.getElementById("q").value.trim();if(q){S.meal=/^\d{8,14}$/.test(q.replace(/\s/g,""))?null:estimateMeal(q);runSearch(q)}}
  if(e.target.id==="bodyForm"){const date=document.getElementById("bDate").value||todayKey();const x={type:"body",date};let any=false;
    ["weight","waist","hips","chest","arm","thigh"].forEach(k=>{const v=document.getElementById("b_"+k).value;if(v!==""){x[k]=+v;any=true}});
    if(!any){toast("Enter at least one measurement");return}save("body_"+date,x);toast("Entry saved")}
});
document.getElementById("photoIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)runSearch(document.getElementById("q")?.value.trim()||"",f)});

/* ---------- boot ---------- */
document.getElementById("lookIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)loadPhoto(f)});
document.getElementById("reportIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importReport(f)});
document.getElementById("phIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)addPhotoFile(f)});
document.getElementById("importIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)importData(f)});
applyLook();
if(activeProf().pin)S.lock={id:PROF.active,boot:true};
if(!window.claude||!window.claude.use){loadLocal();afterLoad()}
if("serviceWorker" in navigator&&window.isSecureContext&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
(async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){loadLocal();render();return}
    const uid=await user.id();
    S.db=db;S.uid=uid;subscribe();
  }catch(e){loadLocal();render()}
})();
function subscribe(){if(typeof S.unsub==="function")S.unsub();
    S.col=S.db.collection("data/users/"+S.uid+(PROF.active==="main"?"":"_"+PROF.active));
    S.unsub=S.col.onSnapshot(snap=>{
      if(snap.empty){if(!S.example){S.docs={settings:DEFAULT_SETTINGS}}render();return}
      const docs={};snap.docs.forEach(x=>{docs[x.id]=x.data()});Object.keys(timers).forEach(id=>{if(S.docs[id])docs[id]=S.docs[id]});S.docs=docs;S.example=false;render();
    },()=>{toast("Couldn't load your saved data")});
}
})();
</script>
