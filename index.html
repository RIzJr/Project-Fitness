<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>Project Fitness</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, gym-whiteboard numerals, fixed bottom tab bar */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E3E9EC; --fg:#13212B; --muted:#5C6B75; --line:#D3DCE1;
  --accent:#0E6B66; --accent-ink:#FFFFFF;
  --protein:#C2453A; --veg:#3E8A3A; --carb:#B7791F; --fat:#6E4FB0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1519; --surface:#172127; --sunk:#202C33; --fg:#E6EDF0; --muted:#93A3AC; --line:#2B3940;
  --accent:#3FB8AE; --accent-ink:#06201E;
  --protein:#EB7B70; --veg:#7CC476; --carb:#E3A94F; --fat:#A98BEA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1519; --surface:#172127; --sunk:#202C33; --fg:#E6EDF0; --muted:#93A3AC; --line:#2B3940;
  --accent:#3FB8AE; --accent-ink:#06201E;
  --protein:#EB7B70; --veg:#7CC476; --carb:#E3A94F; --fat:#A98BEA; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
h2{font-family:var(--display);font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.banner{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
/* macros */
.macro{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.macro:first-of-type{border-top:0;padding-top:0}
.macro .left{grid-column:1/-1;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-2px}
.bar{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.bar.over i{background:repeating-linear-gradient(45deg,var(--c) 0 6px,transparent 6px 9px)}
.editform{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--sunk);border-radius:10px;padding:12px}
.editform .wide{grid-column:1/-1}
.editform .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:380px){.editform{grid-template-columns:1fr 1fr}}
/* portions */
.portion{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.portion:first-of-type{border-top:0;padding-top:0}
.pname{display:flex;align-items:baseline;gap:8px}
.pname b{font-family:var(--display);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.pname span{font-size:12.5px;color:var(--muted)}
.count{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.count small{font-size:16px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px;flex-wrap:wrap;grid-column:1}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dot.full{background:var(--c)}
.dot.half{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.dot.over{background:var(--c);opacity:.45}
.steppers{display:flex;gap:6px;grid-column:2;justify-content:flex-end}
.steppers button{width:40px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:600;line-height:1}
.steppers button.add{background:var(--c);border-color:var(--c);color:#fff}
.kcal{display:flex;justify-content:space-between;align-items:baseline;background:var(--sunk);border-radius:10px;padding:10px 12px}
.kcal b{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
/* habits */
.habit{display:flex;gap:10px;align-items:center;padding:6px 0}
.habit input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hrow{display:flex;gap:6px;align-items:center}
.hrow input{flex:1;background:var(--surface)}
.hb{flex:none;width:36px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;line-height:1}
.hb:disabled{opacity:.35;cursor:default}
.hb.del{color:var(--protein)}
/* foods */
.food{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.food:first-child{border-top:0}
.food .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.food .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:1px 7px;color:var(--c);border:1px solid var(--c)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:0 4px}
.result{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:12.5px}
.status{font-size:13px;color:var(--muted);min-height:1em}
/* workouts */
.ex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 28px;gap:6px;align-items:center}
.set .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.hist{display:flex;flex-direction:column}
.hist .item{padding:10px 0;border-top:1px solid var(--line)}
.hist .item:first-child{border-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 0;font-weight:600;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.lastline{background:var(--sunk);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.lastline button{align-self:flex-start}
.exhead{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.exhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.exdetail{margin-top:8px;display:flex;flex-direction:column;gap:2px}
/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{border:0;background:transparent;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;z-index:9;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.dot{transition:background .15s}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>

<script>
(function(){
const MAC = {
  kcal:{label:"Calories",unit:"kcal",c:"var(--accent)"},
  protein:{label:"Protein",unit:"g",c:"var(--protein)"},
  carbs:{label:"Carbs",unit:"g",c:"var(--carb)"},
  fat:{label:"Fat",unit:"g",c:"var(--fat)"}
};
const MK = Object.keys(MAC), GK=["protein","carbs","fat"];
const DEFAULT_TARGETS={kcal:2400,protein:180,carbs:240,fat:80};
const DEFAULT_SETTINGS = {type:"settings",targets:DEFAULT_TARGETS,
  habits:["50 bodyweight reps","2 litres of water","8,000+ steps","7+ hours sleep","Protein at every meal"]};
const macroKcal=t=>Math.round((+t.protein||0)*4+(+t.carbs||0)*4+(+t.fat||0)*9);

const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);const dt=new Date(y,m-1,d+n);return keyOf(dt)};
const fmtDay=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})};
const half=n=>Math.round(n*2)/2;
const fmtN=n=>Number.isInteger(n)?String(n):n.toFixed(1);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const S = {tab:"today",day:todayKey(),docs:{},example:true,db:null,col:null,sample:null,
  results:[],searching:false,searchMsg:"",draftWorkout:null,ciDraft:null,showTargets:false,editFood:null};

/* ---------- example data shown until the first real entry ---------- */
function exampleDocs(){
  const t=todayKey(), docs={settings:DEFAULT_SETTINGS};
  docs["day_"+t]={type:"day",date:t,habits:{"Protein at every meal":true,"2 litres of water":true},
    foods:[{name:"3 scrambled eggs + 1 slice wholemeal toast",kcal:330,protein:22,carbs:16,fat:19},
           {name:"Chicken breast, rice & broccoli",kcal:520,protein:45,carbs:60,fat:9},
           {name:"Greek yoghurt 0% (170g) + berries",kcal:140,protein:17,carbs:15,fat:0}]};
  const w=[83.4,83.1,82.9,83.0,82.6,82.4,82.1];
  w.forEach((kg,i)=>{const k=addDays(t,-(6-i)*7);docs["body_"+k]={type:"body",date:k,weight:kg,waist:i===6?88:(i===0?91:null)}});
  docs["wo_ex1"]={type:"workout",date:addDays(t,-1),name:"Lower A",exercises:[
    {name:"Back squat",sets:[{kg:80,reps:8},{kg:80,reps:8},{kg:80,reps:7}]},
    {name:"Romanian deadlift",sets:[{kg:70,reps:10},{kg:70,reps:10}]}]};
  const ck=addDays(t,-((new Date().getDay()+6)%7));
  docs["ci_"+ck]={type:"checkin",date:ck,adherence:4,energy:4,sleep:3,stress:2,hunger:3,win:"Hit protein every day",struggle:"Late snacking Thursday",focus:"Pre-plan evening snack"};
  return docs;
}
S.docs=exampleDocs();

/* ---------- storage ---------- */
const LS="hpc-docs";
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const d=JSON.parse(r);if(Object.keys(d).length){S.docs=d;S.example=false}}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S.docs))}catch(e){}}
const timers={};
function save(id,data){
  if(S.example){S.docs={settings:S.docs.settings||DEFAULT_SETTINGS};S.example=false;
    if(S.col){S.col.doc("settings").set(clone(S.docs.settings)).catch(()=>{})}}
  S.docs[id]=data;render();
  if(S.col){clearTimeout(timers[id]);timers[id]=setTimeout(()=>{S.col.doc(id).set(clone(data)).catch(e=>toast("Couldn't save: "+(e&&e.message||"try again"))).finally(()=>{delete timers[id]})},500)}
  else saveLocal();
}
function remove(id){delete S.docs[id];render();if(S.col){S.col.doc(id).delete().catch(()=>toast("Couldn't delete, try again"))}else saveLocal()}
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}

const settings=()=>{const s=S.docs.settings||DEFAULT_SETTINGS;return (s.targets&&s.targets.kcal!=null)?s:{...s,targets:DEFAULT_TARGETS}};
function dayDoc(k){return S.docs["day_"+k]||{type:"day",date:k,foods:[],habits:{}}}
function totals(d){const t={kcal:0,protein:0,carbs:0,fat:0};(d.foods||[]).forEach(f=>MK.forEach(k=>t[k]+=+f[k]||0));return t}
const ofType=t=>Object.entries(S.docs).filter(([,d])=>d&&d.type===t).map(([id,d])=>({id,...d})).sort((a,b)=>a.date<b.date?1:-1);

/* ---------- render ---------- */
const ICONS={
  today:'<svg viewBox="0 0 24 24"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V11M16 11V7a1.5 1.5 0 0 1 3 0v6.5a7 7 0 0 1-7 7h-.5a6.5 6.5 0 0 1-5.4-2.9L4 14.4a1.5 1.5 0 0 1 2.4-1.8L7 13.5"/></svg>',
  train:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
  body:'<svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>',
  checkin:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 13l3 3 5-6"/></svg>'};
const TABS=[["today","Today"],["train","Train"],["body","Body"],["checkin","Check-in"]];
function renderTabs(){document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${ICONS[k]}${l}</button>`).join("")}

function exampleBanner(){return S.example?`<div class="banner"><span>Showing example data. Your first entry replaces it.</span><button class="btn ghost" data-act="clearEx">Start fresh</button></div>`:""}

function foodForm(f,i){
  const v=k=>f&&f[k]!=null&&f[k]!==""?f[k]:"";
  return `<form class="editform" data-form="food" data-i="${i}">
    <label class="field wide"><span class="label">Food</span><input id="ef_name" value="${esc(v("name"))}" placeholder="e.g. Chicken wrap" required></label>
    <label class="field"><span class="label">Protein g</span><input id="ef_protein" type="number" step="0.1" inputmode="decimal" value="${v("protein")}"></label>
    <label class="field"><span class="label">Carbs g</span><input id="ef_carbs" type="number" step="0.1" inputmode="decimal" value="${v("carbs")}"></label>
    <label class="field"><span class="label">Fat g</span><input id="ef_fat" type="number" step="0.1" inputmode="decimal" value="${v("fat")}"></label>
    <label class="field"><span class="label">kcal</span><input id="ef_kcal" type="number" step="1" inputmode="numeric" value="${v("kcal")}" placeholder="auto"></label>
    <span class="small muted wide">Leave calories blank to work them out from the macros.</span>
    <div class="acts"><button class="btn primary" type="submit">${i==="new"?"Add food":"Save changes"}</button><button class="btn" type="button" data-act="cancelFood">Cancel</button>${i!=="new"?`<button class="btn ghost" type="button" data-act="delFood" data-i="${i}">Delete</button>`:""}</div>
  </form>`}
function renderToday(){
  const d=dayDoc(S.day), st=settings(), tg=st.targets, tot=totals(d);
  const rows=MK.map(k=>{
    const v=Math.round(tot[k]),t=+tg[k]||0,pct=t?Math.min(100,v/t*100):0,left=t-v;
    return `<div class="macro" style="--c:${MAC[k].c}">
      <div class="pname"><b>${MAC[k].label}</b></div>
      <div class="count">${v.toLocaleString("en-GB")}<small> / ${t.toLocaleString("en-GB")}${MAC[k].unit==="g"?"g":""}</small></div>
      <div class="bar ${v>t&&t?"over":""}" role="progressbar" aria-label="${MAC[k].label}" aria-valuenow="${v}" aria-valuemax="${t}"><i style="width:${pct}%"></i></div>
      <div class="left">${left>=0?left.toLocaleString("en-GB")+(MAC[k].unit==="g"?"g":" kcal")+" left":Math.abs(left).toLocaleString("en-GB")+(MAC[k].unit==="g"?"g":" kcal")+" over"}</div>
    </div>`}).join("");
  const habits=st.habits.map((h,i)=>`<label class="habit"><input type="checkbox" id="hab${i}" data-act="habit" data-h="${esc(h)}" ${d.habits&&d.habits[h]?"checked":""}><span>${esc(h)}</span></label>`).join("");
  const done=st.habits.filter(h=>d.habits&&d.habits[h]).length;
  const foods=(d.foods||[]).map((f,i)=>S.editFood===i?foodForm(f,i):`<div class="food"><div style="min-width:0"><div class="nm">${esc(f.name)}</div>
    <div class="meta">${Math.round(+f.kcal||0)} kcal · P ${fmtN(+f.protein||0)}g · C ${fmtN(+f.carbs||0)}g · F ${fmtN(+f.fat||0)}g</div></div>
    <button class="btn ghost" data-act="editFood" data-i="${i}" aria-label="Edit ${esc(f.name)}">Edit</button></div>`).join("")||(S.editFood==="new"?"":`<p class="muted small" style="margin:0">Nothing logged yet. Search a food, scan a label, or add one manually.</p>`);
  const results=S.results.map((r,i)=>`<div class="result"><div style="min-width:0"><div class="nm" style="font-weight:600">${esc(r.name)}</div>
    <div class="meta small muted">${r.serving?esc(r.serving)+" · ":""}${Math.round(r.kcal||0)} kcal · P ${Math.round(r.protein_g||0)}g · C ${Math.round(r.carbs_g||0)}g · F ${Math.round(r.fat_g||0)}g</div></div>
    <button class="btn primary" data-act="addRes" data-i="${i}">Add</button></div>`).join("");
  const isToday=S.day===todayKey();
  return `${exampleBanner()}
  <header class="top"><div><h1>${isToday?"Today":fmtDay(S.day)}</h1><div class="sub">${isToday?fmtDay(S.day):"Viewing a past day"}</div></div>
    <div class="daynav"><button data-act="prevDay" aria-label="Previous day">‹</button><button data-act="nextDay" aria-label="Next day" ${isToday?"disabled":""}>›</button></div></header>
  <div class="stack">
  <section class="panel"><div class="spread"><h2>Macros</h2><button class="btn ghost" data-act="targets">${S.showTargets?"Done":"Edit targets"}</button></div>
    ${S.showTargets?renderTargets():""}
    <div>${rows}</div>
  </section>
  <section class="panel"><h2>Log food</h2>
    <form class="row" id="searchForm" style="flex-wrap:nowrap"><input id="q" placeholder="e.g. Tesco meal deal chicken wrap" autocomplete="off" enterkeyhint="search"><button class="btn primary" type="submit" ${S.searching?"disabled":""}>Search</button></form>
    <div class="row"><button class="btn" data-act="photo" ${S.searching?"disabled":""}>Scan barcode or label</button><button class="btn" data-act="newFood">Add manually</button></div>
    <div class="status" aria-live="polite">${esc(S.searchMsg)}</div>
    ${results?`<div class="stack" style="gap:8px">${results}</div>`:""}
    ${S.editFood==="new"?foodForm(null,"new"):""}
    <div class="label" style="margin-top:4px">Logged ${isToday?"today":"this day"}</div>
    <div class="stack" style="gap:0">${foods}</div>
  </section>

/* ---------- exercise library + per-exercise history ---------- */
const EX_LIB={
  "Chest":["Barbell bench press","Incline barbell bench press","Decline bench press","Dumbbell bench press","Incline dumbbell press","Dumbbell fly","Cable fly","Low-to-high cable fly","Pec deck","Machine chest press","Push-up","Dips (chest)"],
  "Back":["Deadlift","Barbell row","Pendlay row","Dumbbell row","Chest-supported row","T-bar row","Seated cable row","Lat pulldown","Close-grip lat pulldown","Pull-up","Chin-up","Straight-arm pulldown","Machine row","Rack pull","Back extension"],
  "Shoulders":["Overhead press","Seated dumbbell shoulder press","Arnold press","Machine shoulder press","Dumbbell lateral raise","Cable lateral raise","Front raise","Rear delt fly","Reverse pec deck","Face pull","Upright row","Barbell shrug","Dumbbell shrug"],
  "Biceps":["Barbell curl","EZ-bar curl","Dumbbell curl","Hammer curl","Incline dumbbell curl","Preacher curl","Cable curl","Concentration curl"],
  "Triceps":["Close-grip bench press","Triceps pushdown","Rope pushdown","Overhead cable extension","Skull crusher","Overhead dumbbell extension","Dips (triceps)","Bench dip"],
  "Quads":["Back squat","Front squat","Goblet squat","Hack squat","Leg press","Bulgarian split squat","Walking lunge","Reverse lunge","Step-up","Leg extension","Smith machine squat"],
  "Hamstrings & glutes":["Romanian deadlift","Stiff-leg deadlift","Lying leg curl","Seated leg curl","Nordic curl","Good morning","Hip thrust","Glute bridge","Cable kickback","Hip abduction machine","Kettlebell swing"],
  "Calves":["Standing calf raise","Seated calf raise","Leg press calf raise"],
  "Core":["Plank","Side plank","Hanging leg raise","Cable crunch","Ab wheel rollout","Dead bug","Pallof press","Russian twist","Decline sit-up"],
  "Conditioning":["Farmer's carry","Sled push","Rowing machine","Assault bike","Treadmill incline walk","Battle ropes","Burpees"]
};
const LIB_GROUP={};Object.entries(EX_LIB).forEach(([g,l])=>l.forEach(n=>LIB_GROUP[n.toLowerCase()]=g));
const exKey=n=>String(n||"").trim().toLowerCase();
// every logged instance of an exercise, newest first (example data excluded once real data exists)
function exHistory(name){const k=exKey(name);if(!k)return[];const out=[];
  ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{if(exKey(e.name)===k&&e.sets&&e.sets.length)out.push({date:w.date,session:w.name,sets:e.sets})}));return out}
const e1rm=s=>(+s.kg||0)*(1+(+s.reps||0)/30);
function bestSet(sets){return sets.reduce((b,s)=>!b||e1rm(s)>e1rm(b)?s:b,null)}
const fmtSets=sets=>sets.map(s=>`${fmtN(+s.kg||0)}×${s.reps||0}`).join(", ");
function exOptions(){const mine=new Map();ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{const k=exKey(e.name);if(k&&!LIB_GROUP[k]&&!mine.has(k))mine.set(k,e.name.trim())}));
  return [...mine.values()].map(n=>`<option value="${esc(n)}" label="Your exercise">`).join("")+Object.entries(EX_LIB).map(([g,l])=>l.map(n=>`<option value="${esc(n)}" label="${esc(g)}">`).join("")).join("")}
function lastLine(name,ei){if(!exKey(name))return"";const h=exHistory(name);
  if(!h.length)return `<div class="lastline small muted">First time logging this. Today sets your baseline.</div>`;
  const l=h[0],b=bestSet(h.flatMap(x=>x.sets));
  return `<div class="lastline small"><div><span class="muted">Last time (${fmtDay(l.date)}):</span> ${fmtSets(l.sets)}</div>
    <div class="muted">Best: ${fmtN(+b.kg||0)} kg × ${b.reps} · est. 1RM ${fmtN(Math.round(e1rm(b)*2)/2)} kg</div>
    <button class="btn ghost" style="padding:4px 0" data-act="useLast" data-ei="${ei}">Copy last time's sets</button></div>`}
function exSpark(h){const pts=h.slice(0,10).reverse().map(x=>e1rm(bestSet(x.sets)));if(pts.length<2)return"";
  const W=120,H=32,lo=Math.min(...pts),hi=Math.max(...pts),r=hi-lo||1;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map((v,i)=>`${(i*(W-4)/(pts.length-1)+2).toFixed(1)},${(H-3-(v-lo)/r*(H-6)).toFixed(1)}`).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/></svg>`}
function renderExercises(){
  const map=new Map();ofType("workout").forEach(w=>(w.exercises||[]).forEach(e=>{const k=exKey(e.name);if(k&&!map.has(k))map.set(k,e.name.trim())}));
  if(!map.size)return"";
  const q=exKey(S.exFilter);
  const rows=[...map.entries()].filter(([k])=>!q||k.includes(q)).map(([k,name])=>{const h=exHistory(name),b=bestSet(h.flatMap(x=>x.sets)),open=S.openEx===k;
    return `<div class="item"><button class="exhead" data-act="openEx" data-k="${esc(k)}" aria-expanded="${open}">
      <span style="min-width:0"><b>${esc(name)}</b><span class="small muted" style="display:block">${LIB_GROUP[k]||"Your exercise"} · ${h.length} session${h.length===1?"":"s"} · last ${fmtDay(h[0].date)}</span></span>
      <span class="small" style="text-align:right;font-variant-numeric:tabular-nums;flex:none">${fmtN(+b.kg||0)} kg × ${b.reps}<span class="muted" style="display:block">est. 1RM ${fmtN(Math.round(e1rm(b)*2)/2)}</span></span></button>
      ${open?`<div class="exdetail">${exSpark(h)?`<div class="small muted">Est. 1RM trend</div>${exSpark(h)}`:""}
        ${h.map(x=>`<div class="spread small" style="padding:4px 0;border-top:1px solid var(--line)"><span class="muted">${fmtDay(x.date)}${x.session?" · "+esc(x.session):""}</span><span style="font-variant-numeric:tabular-nums;text-align:right">${fmtSets(x.sets)}</span></div>`).join("")}</div>`:""}</div>`}).join("");
  return `<section class="panel"><div class="spread"><h2>Exercise history</h2><span class="label">${map.size} exercise${map.size===1?"":"s"}</span></div>
    ${map.size>5?`<input id="exFilter" data-act="exFilter" placeholder="Find an exercise" value="${esc(S.exFilter||"")}" autocomplete="off">`:""}
    <div class="hist">${rows||'<p class="muted small" style="margin:0">No match.</p>'}</div></section>`}

function weightChart(list){
  const pts=list.filter(b=>b.weight).slice(0,12).reverse(); if(pts.length<2)return `<p class="muted small" style="margin:0">Log at least two weigh-ins to see your trend.</p>`;
  const W=320,H=140,L=34,R=10,T=12,B=22,ws=pts.map(p=>+p.weight);let lo=Math.floor(Math.min(...ws)-.5),hi=Math.ceil(Math.max(...ws)+.5);
  const x=i=>L+i*(W-L-R)/(pts.length-1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const line=pts.map((p,i)=>`${x(i).toFixed(1)},${y(+p.weight).toFixed(1)}`).join(" ");
  const area=`${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}`;
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(v)}</text>`).join("");
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight trend">${ticks}
    <polygon points="${area}" fill="var(--accent)" opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(+last.weight)}" r="4" fill="var(--accent)"/>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)">${fmtDay(pts[0].date)}</text><text x="${W-R}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${fmtDay(last.date)}</text></svg>`;
}

const CQ=[["adherence","Plan adherence"],["energy","Energy"],["sleep","Sleep quality"],["stress","Stress"],["hunger","Hunger"]];
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return keyOf(d)}
function renderCheckin(){

/* ---------- food search via Claude ---------- */
const FOOD_PROMPT=`You are a nutrition assistant for a UK personal trainer who tracks calories and macros.
Use UK products, supermarkets and serving sizes where relevant. Read values straight from a nutrition label when one is visible; otherwise estimate.
Return ONLY JSON: {"items":[{"name":string,"serving":string,"kcal":number,"protein_g":number,"carbs_g":number,"fat_g":number}]}
Give up to 4 likely matches, most likely first. If the input describes one whole meal, return it as one item.`;
async function getSample(){if(S.sample)return S.sample;if(!window.claude||!window.claude.use)return null;S.sample=await window.claude.use("sample");return S.sample}
async function runSearch(q,img){
  const sample=await getSample();
  if(!sample){S.searchMsg="Food search needs the page open in Claude while signed in. You can still add food manually.";render();return}
  S.searching=true;S.results=[];S.searchMsg=img?"Reading your photo…":"Searching…";render();
  try{
    const input=img?FOOD_PROMPT+"\n\nThe attached photo shows a product barcode, nutrition label, packaging or a plate of food. Identify the product or meal and estimate one typical serving."+(q?" Extra note: "+q:""):FOOD_PROMPT+"\n\nFood: "+q;
    const res=await sample.json(input,img?{images:[img],modelTier:"default"}:{modelTier:"quick"});
    S.results=(res&&res.items)||[];S.searchMsg=S.results.length?"Estimates. Tap Add to log one.":"No match found. Try describing it differently.";
  }catch(e){S.searchMsg=e&&e.code==="not_granted"?"Allow Claude access for this page to use food search.":e&&e.code==="rate_limited"?"Too many searches just now. Wait a minute and try again.":"Search didn't work. Try again."}
  S.searching=false;render();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-tab]");if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;S.ciDraft=null;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,ds=b.dataset;
  const d=()=>clone(dayDoc(S.day));
  switch(a){
    case "clearEx":S.docs={settings:S.docs.settings||DEFAULT_SETTINGS};S.example=false;S.ciDraft=null;if(S.col)S.col.doc("settings").set(clone(S.docs.settings)).catch(()=>{});else saveLocal();render();break;
    case "prevDay":S.day=addDays(S.day,-1);S.results=[];S.editFood=null;render();break;
    case "nextDay":if(S.day<todayKey()){S.day=addDays(S.day,1);S.results=[];S.editFood=null;render()}break;
    case "matchKcal":{const st=clone(settings());st.targets.kcal=macroKcal(st.targets);save("settings",st);break}
    case "targets":S.showTargets=!S.showTargets;render();break;
    case "editHabits":S.editHabits=settings().habits.map(h=>({name:h,old:h}));render();break;
    case "cancelHabits":S.editHabits=null;render();break;
    case "habUp":case "habDown":{const H=S.editHabits,i=+ds.i,j=a==="habUp"?i-1:i+1;if(j<0||j>=H.length)break;[H[i],H[j]]=[H[j],H[i]];render();document.getElementById("he"+j)?.focus();break}
    case "habDel":S.editHabits.splice(+ds.i,1);render();break;
    case "saveHabits":{const seen=new Set(),H=S.editHabits.map(h=>({name:h.name.trim(),old:h.old})).filter(h=>h.name&&!seen.has(h.name.toLowerCase())&&seen.add(h.name.toLowerCase()));
      const st=clone(settings());st.habits=H.map(h=>h.name);
      const x=clone(dayDoc(S.day)),oh=x.habits||{},nh={};let moved=false;
      H.forEach(h=>{if(h.old&&h.old!==h.name&&oh[h.old]){nh[h.name]=true;moved=true}else if(oh[h.name])nh[h.name]=oh[h.name]});
      S.editHabits=null;save("settings",st);if(moved){Object.keys(oh).forEach(k=>{if(!(k in nh)&&!H.some(h=>h.old===k&&h.old!==h.name))nh[k]=oh[k]});x.habits=nh;save("day_"+S.day,x)}
      toast("Habits saved");break}
    case "photo":document.getElementById("photoIn").click();break;
    case "addRes":{const r=S.results[+ds.i];const x=d();x.foods=(x.foods||[]).concat([{name:r.name+(r.serving?" ("+r.serving+")":""),kcal:Math.round(+r.kcal||0),protein:+(+r.protein_g||0).toFixed(1),carbs:+(+r.carbs_g||0).toFixed(1),fat:+(+r.fat_g||0).toFixed(1)}]);
      S.results=[];S.searchMsg="";const q=document.getElementById("q");if(q)q.value="";save("day_"+S.day,x);toast("Added. Tap Edit to change the amounts");break}
    case "newFood":S.editFood="new";render();document.getElementById("ef_name")?.focus();break;
    case "editFood":S.editFood=+ds.i;render();document.getElementById("ef_name")?.focus();break;
    case "cancelFood":S.editFood=null;render();break;
    case "delFood":{const x=d();x.foods.splice(+ds.i,1);S.editFood=null;save("day_"+S.day,x);toast("Deleted");break}
    case "newWo":S.draftWorkout={type:"workout",date:todayKey(),name:"",exercises:[{name:"",sets:[{kg:"",reps:""}]}]};render();break;
    case "repeatWo":{const w=clone(S.docs[ds.id]);w.date=todayKey();w.exercises.forEach(e=>e.sets.forEach(s=>{}));S.draftWorkout=w;render();window.scrollTo(0,0);break}
    case "cancelWo":S.draftWorkout=null;render();break;
    case "useLast":{const ex=S.draftWorkout.exercises[+ds.ei],h=exHistory(ex.name);if(h.length){ex.sets=h[0].sets.map(s=>({kg:s.kg,reps:s.reps}));render();toast("Copied. Add a rep or a little weight to progress")}break}
    case "openEx":S.openEx=S.openEx===ds.k?null:ds.k;render();break;
    case "addEx":S.draftWorkout.exercises.push({name:"",sets:[{kg:"",reps:""}]});render();break;
    case "delEx":S.draftWorkout.exercises.splice(+ds.ei,1);render();break;
    case "addSet":{const ex=S.draftWorkout.exercises[+ds.ei];const last=ex.sets[ex.sets.length-1]||{};ex.sets.push({kg:last.kg??"",reps:last.reps??""});render();break}
    case "delSet":S.draftWorkout.exercises[+ds.ei].sets.splice(+ds.si,1);render();break;
    case "saveWo":{const w=S.draftWorkout;w.exercises=w.exercises.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:e.sets.filter(s=>s.reps!==""&&s.reps!=null).map(s=>({kg:+s.kg||0,reps:+s.reps||0}))}));
      if(!w.exercises.length){toast("Add at least one exercise with a name");break}S.draftWorkout=null;save("wo_"+Date.now(),w);toast("Session saved");break}
    case "delWo":remove(ds.id);break;
    case "delBody":remove(ds.id);break;
    case "ciScale":S.ciDraft[ds.k]=+ds.n;render();break;
    case "saveCi":{const c=clone(S.ciDraft);save("ci_"+c.date,c);S.ciDraft=null;toast("Check-in saved");break}
    case "delCi":remove(ds.id);break;
  }
});
document.addEventListener("change",e=>{const t=e.target,ds=t.dataset;
  if(ds.act==="habit"){const x=clone(dayDoc(S.day));x.habits=x.habits||{};x.habits[ds.h]=t.checked;save("day_"+S.day,x)}
  if(ds.act==="target"){const st=clone(settings());st.targets[ds.k]=Math.max(0,Math.round(+t.value||0));save("settings",st)}
  if(ds.act==="woDate")S.draftWorkout.date=t.value;
  if(ds.act==="exName"){S.draftWorkout.exercises[+ds.ei].name=t.value;render()}
});
document.addEventListener("input",e=>{const t=e.target,ds=t.dataset;
  if(ds.act==="woName")S.draftWorkout.name=t.value;
  if(ds.act==="exName"){S.draftWorkout.exercises[+ds.ei].name=t.value;
    if(LIB_GROUP[exKey(t.value)]||exHistory(t.value).length)render()} // picked from the list: show last time straight away
  if(ds.act==="exFilter"){S.exFilter=t.value;render()}
  if(ds.act==="setKg")S.draftWorkout.exercises[+ds.ei].sets[+ds.si].kg=t.value;
  if(ds.act==="setReps")S.draftWorkout.exercises[+ds.ei].sets[+ds.si].reps=t.value;
  if(ds.act==="ciText")S.ciDraft[ds.k]=t.value;
  if(ds.act==="habName")S.editHabits[+ds.i].name=t.value;
});
document.addEventListener("submit",e=>{e.preventDefault();
  if(e.target.dataset.form==="food"){const g=id=>document.getElementById(id).value;const name=g("ef_name").trim();if(!name){toast("Give the food a name");return}
    const f={name,protein:+g("ef_protein")||0,carbs:+g("ef_carbs")||0,fat:+g("ef_fat")||0};f.kcal=g("ef_kcal")!==""?Math.round(+g("ef_kcal")):macroKcal(f);
    const x=clone(dayDoc(S.day));x.foods=x.foods||[];const i=e.target.dataset.i;if(i==="new")x.foods.push(f);else x.foods[+i]=f;
    S.editFood=null;save("day_"+S.day,x);toast(i==="new"?"Food added":"Changes saved");return}
  if(e.target.id==="habAddForm"){const inp=document.getElementById("habNew"),v=inp.value.trim();if(!v){inp.focus();return}
    if(S.editHabits.some(h=>h.name.trim().toLowerCase()===v.toLowerCase())){toast("That habit's already on the list");return}
    S.editHabits.push({name:v,old:null});render();document.getElementById("habNew")?.focus();return}
  if(e.target.id==="searchForm"){const q=document.getElementById("q").value.trim();if(q)runSearch(q)}
  if(e.target.id==="bodyForm"){const date=document.getElementById("bDate").value||todayKey();const x={type:"body",date};let any=false;
    ["weight","waist","hips","chest","arm","thigh"].forEach(k=>{const v=document.getElementById("b_"+k).value;if(v!==""){x[k]=+v;any=true}});
    if(!any){toast("Enter at least one measurement");return}save("body_"+date,x);toast("Entry saved")}
});
document.getElementById("photoIn").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(f)runSearch(document.getElementById("q")?.value.trim()||"",f)});

/* ---------- boot ---------- */
render();
(async function connect(){
  if(!window.claude||!window.claude.use){loadLocal();render();return}
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){loadLocal();render();return}
    const uid=await user.id();
    S.db=db;S.col=db.collection("data/users/"+uid);
    S.col.onSnapshot(snap=>{
      if(snap.empty){if(!S.example){S.docs={settings:DEFAULT_SETTINGS}}render();return}
      const docs={};snap.docs.forEach(x=>{docs[x.id]=x.data()});Object.keys(timers).forEach(id=>{if(S.docs[id])docs[id]=S.docs[id]});S.docs=docs;S.example=false;render();
    },()=>{toast("Couldn't load your saved data")});
  }catch(e){loadLocal();render()}
})();
})();
</script>


</body>
